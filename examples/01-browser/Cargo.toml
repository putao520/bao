[package]
name = "bao-example-01-browser"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "bao-example-01-browser"
path = "main.rs"

[dependencies]
bao-core = { path = "../../src/bao" }
# Mirror the ROOT workspace's [patch.crates-io] (examples/ is excluded from
# the workspace, so patches do NOT propagate — without this the examples
# resolve the registry `freetype` and fail against the vendored source;
# caught by src/bao/tests/examples_compile_tests.rs #17-G).
# Keep in sync with the root Cargo.toml patch section.
# REQ-ARCH-4 (2026-10-16): the stylo-family `stylo_atoms` patch entry is
# retired — the crate is renamed to `bao-stylo-atoms` and wired by
# path+package in the consuming manifests (a [patch] entry cannot rename a
# package). The examples resolve it transitively via bao-core.
[patch.crates-io]
freetype = { path = "../../vendor/freetype-wrapper" }
