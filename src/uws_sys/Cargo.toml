[package]
name = "bun_uws_sys"
# 0.2.4 (2026-11-14, issue #59 consumer-build closure): the C face no longer
# requires any undeclared system header on clean images — the dead
# <mimalloc.h> include is removed from epoll_kqueue.c (the mi_on_thread_idle*
# hooks resolve from the crate's Rust no-op supply, and the allocator face
# maps to libc since bun_alloc 0.2.0 / #45), and the uWS headers carry
# explicit `typename` on dependent-type callback params (a form clang 15+
# only; clang 14 — rust:1-bookworm / MW desktop image — rejected all 9
# sites). Clean rust:1-bookworm consumer probe: cargo check RC=0.
version = "0.2.4"
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
path = "lib.rs"

[build-dependencies]
cc = "1"

[lints]
workspace = true

[dependencies]
bun_opaque.workspace = true
thiserror.workspace = true
strum.workspace = true
phf.workspace = true
bstr.workspace = true
libc.workspace = true
bitflags.workspace = true
bun_boringssl_sys.workspace = true
bun_lsquic_sys.workspace = true
bun_core.workspace = true
bun_errno.workspace = true
bun_http_types.workspace = true

[target.'cfg(windows)'.dependencies]
bun_windows_sys.workspace = true
bun_libuv_sys.workspace = true
bun_paths.workspace = true
# no cycle: bun_paths -> {bun_core, bun_alloc}; neither depends on bun_uws_sys
