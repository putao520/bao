[package]
name = "cdp-server"
# 0.2.2 (2026-10-28): test-only content drift (suite common/port_probe +
# server_stop_tests, d97f062c6) — e99 same-name-drift discipline bump
# (tests ship in the tarball); lib face unchanged → patch.
version = "0.2.2"
edition = "2021"
repository.workspace = true
readme = "README.md"
description = "Generic CDP (Chrome DevTools Protocol) server framework"
license = "MIT OR MPL-2.0"

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30", features = ["handshake"] }
# REQ-ARCH-3 (wave R3): the console receiver half (`CdpServer::
# set_console_receiver`) is spelled through the unified MPMC substrate's
# transparent re-export — single import point, same rule as every other
# channel face (the paired sender lives in bao_browser's delegates).
bao_ipc = { path = "../bao_ipc", version = "0.1.0" }
bun_url = { path = "../url", version = "^0.2.1" }
