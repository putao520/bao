[package]
name = "bun_core"
# 0.1.1 (2026-08-19): explicit version — breaks workspace inheritance
# so this patch release ships alone. stable dual-mode (allocator_api/thread_local under bao_nightly cfg + tls_thread_id).
# 0.1.2 (2026-08-19): +pub vec/strings API surface (SpareBytesVec,
# Utf16List, ChanVec, codepoint/convert helpers) that W1 ast/css/
# sourcemap/zstd 0.1.1 and collections 0.1.2 build against.
# 0.1.3 (2026-08-19): +pub AstBox<T> arena-box alias (bundler AstBox
# migration companion, 71afadb4).
# 0.1.4 (2026-08-19): +pub chan_vec_to_std zero-copy reverse adopter
# (ChanVec → std Vec handoff; bun_runtime 0.1.2 consumes it).
# 0.1.5 (2026-08-21): +pub backpressure::BackpressureValve — the shared
# watermark/park-latch core of the fetch staging + servo bridge response-body
# backpressure templates (transport levers stay at the integration sites).
version = "0.1.8"
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
path = "lib.rs"

[lints]
workspace = true

[dependencies]
# Dual-mode: stable builds route the allocator-generic `Write` sink through
# the allocator_api2 mirror (see util.rs); nightly keeps core's types.
allocator-api2.workspace = true
bytemuck = "1"
itoa.workspace = true
bun_opaque.workspace = true
strum.workspace = true
phf.workspace = true
bstr.workspace = true
const_format.workspace = true
libc.workspace = true
bun_alloc.workspace = true
bun_hash.workspace = true
bun_dispatch.workspace = true
bun_simdutf_sys.workspace = true
bun_core_macros.workspace = true
bun_output_tags.workspace = true
# merged from bun_string:
bun_highway.workspace = true
bun_wyhash.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
bun_windows_sys.workspace = true

# NOTE: no dev-dependencies. Any dev-dep cycling back to the bun_core rlib
# either gets silently dropped from the `--lib` test link line by cargo
# (direct `bun_*` deps) or dual-defines this crate's own `#[no_mangle]` symbols
# (`Bun__atexit`, `Bun__onExit`, ...) in the test binary (`bao_native_stubs` /
# `bao_uloop`). The C-seam symbols are self-provided in `native_seam` /
# `util::spawn_ffi`; the `OutputSink[Sys]` link arm is provided
# test-compilation-only in lib.rs (`test_output_sink`).
