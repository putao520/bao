[package]
name = "bun_lsquic_sys"
version = "0.1.12"
description = "Compiled lsquic C library (LiteSpeed QUIC/HTTP3) with lsqpack + lshpack"
edition = "2021"
repository.workspace = true
readme = "README.md"
license = "MIT"
# Links key is load-bearing: without it, this crate's `cargo:rustc-link-lib`
# emissions (build.rs) apply only to its own rlib compile and are never
# forwarded to downstream/final links. Fresh whole-graph builds (e.g. the
# instrumented coverage bin) then rely solely on the embedded rlib archive,
# which single-pass ld cannot resolve when this rlib precedes the referencing
# bun_uws_sys rlib — 44 undefined lsquic_* at link. Declaring links makes
# cargo append the emitted -l flags at the end of every downstream link
# (order-independent). Symptom of its absence: bao_bin link failure with
# undefined lsquic_engine_* in a clean CARGO_TARGET_DIR.
links = "lsquic"

[build-dependencies]
cc = "1"

[dependencies]
# lsquic depends on BoringSSL for TLS. lshpack is now compiled inline.
bun_boringssl_sys = { path = "../boringssl_sys", version = "^0.2.0" }
