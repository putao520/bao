[package]
name = "bun_lsquic_sys"
version = "0.1.4"
description = "Compiled lsquic C library (LiteSpeed QUIC/HTTP3) with lsqpack + lshpack"
edition = "2021"
repository.workspace = true
readme = "README.md"
license = "MIT"

[build-dependencies]
cc = "1"

[dependencies]
# lsquic depends on BoringSSL for TLS. lshpack is now compiled inline.
bun_boringssl_sys = { path = "../boringssl_sys", version = "0.1.0" }
