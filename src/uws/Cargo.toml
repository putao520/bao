[package]
name = "bun_uws"
# 0.1.1 (dual-no_mangle patch, 2026-08-19): explicit version — breaks
# workspace inheritance so this patch release can ship alone. Removes the
# duplicate BUN__warn__extra_ca_load_failed export (single owner bao_uloop);
# strict consumer linkers (wild) died on the old duplicate.
version = "0.1.8"
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
path = "lib.rs"

[lints]
workspace = true

[dependencies]
strum.workspace = true
phf.workspace = true
bstr.workspace = true
scopeguard.workspace = true
bun_boringssl.workspace = true
bun_boringssl_sys.workspace = true
bun_core.workspace = true
bun_uws_sys.workspace = true
bun_ptr.workspace = true
bun_jsc_macros.workspace = true
# REQ-CDP-UWS-001: bun_uws now owns the RFC 6455 codec + handshake + masking
# (server-side via TcpListener-backed `ws_server`, client-side via `ws_client`).
# uWS C++ upstream ships an incomplete ClientApp.h; we host the codec here so
# all WS surface area lives in `bun_uws` (bao_cdp / bao_cdp_client depend on
# bun_uws only — no tungstenite).
bun_base64.workspace = true
