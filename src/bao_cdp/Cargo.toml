[package]
name = "bao_cdp"
version = "0.3.3"
edition = "2021"
description.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bao_engine = { path = "../bao_engine", version = "^0.3.0" }
# REQ-CDP-UWS-001: RFC 6455 codec/handshake/client/server now owned by bun_uws.
# Removed: bao_cdp::{ws, ws_codec, ws_handshake} self-written modules (-930 LOC).
# Removed deps: bun_base64 / bun_sha_hmac / bao_boringssl_bridge / bun_boringssl_sys
#              (only the deleted ws_handshake.rs needed them — SHA1+base64 now
#               live in bun_uws::ws_handshake against BoringSSL directly).
bun_uws = { path = "../uws", version = "^0.2.0" }
compact_str.workspace = true
cdp-server = { path = "../../src/cdp-server", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cdp-protocol = "0.3"
log = "0.4"

# REQ-BRW-048: the DOM/CSS DevTools query methods are verified against a
# live servo page drained through the production bridge handler
# (bao_browser::handle_bridge_command). Dev-only edge — the normal edge is
# bao_browser → bao_cdp; cargo permits the dev-cycle so the e2e lives next
# to the dispatch face it verifies.
[dev-dependencies]
# Package key is `bao-browser` (crates.io name); the lib target stays
# `bao_browser`, so `use bao_browser::` is unchanged in test code.
bao-browser = { path = "../bao_browser", version = "^0.3.0" }
