[package]
name = "bao_cdp"
version = "0.1.0"
edition = "2021"

[dependencies]
bao_engine = { path = "../bao_engine" }
compact_str.workspace = true
cdp-server = { path = "../../src/cdp-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# BUG-CDP-007a resolved: base64/sha1 unused deps removed (no source-level usage).
# BUG-CDP-007b pending: tungstenite → bun_uws WebSocket Server requires new bridge layer
# (bun_uws has no WebSocket Server usage precedent in this workspace; needs async rewrite
# of bao_cdp's sync TCP/WS architecture). Tracked separately.
tungstenite = { version = "0.26", features = ["handshake"] }
cdp-protocol = "0.3"
log = "0.4"
