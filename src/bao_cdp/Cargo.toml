[package]
name = "bao_cdp"
version = "0.1.0"
edition = "2021"

[dependencies]
bao_engine = { path = "../bao_engine" }
bun_base64 = { path = "../base64" }
bun_sha_hmac = { path = "../sha_hmac" }
compact_str.workspace = true
cdp-server = { path = "../../src/cdp-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# BUG-CDP-007a resolved: base64/sha1 unused deps removed (no source-level usage).
# BUG-CDP-007b resolved: tungstenite → ws_codec (RFC 6455 frame codec) + bun_sha_hmac/bun_base64
cdp-protocol = "0.3"
log = "0.4"
