[package]
name = "bao_cdp"
version = "0.1.0"
edition = "2021"

[dependencies]
bao_engine = { path = "../bao_engine" }
compact_str.workspace = true
cdp-server = { path = "../../src/cdp-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bun_uws = { path = "../uws" }
bun_picohttp = { path = "../picohttp" }
bun_base64 = { path = "../base64" }
bun_sha_hmac = { path = "../sha_hmac" }
cdp-protocol = "0.3"
log = "0.4"
