[package]
name = "bao_uloop"
version = "0.1.0"
description = "Raw epoll + eventfd implementation of the uSockets loop ABI for Bao"
edition = "2024"
license = "MIT"

# Tier-0 safe: must not depend on any Bun crate that itself reaches JS or the
# network stack. `bun_uws_sys` provides the #[repr(C)] PosixLoop / InternalLoopData
# mirror we allocate; `libc` provides raw epoll/eventfd syscalls.
[dependencies]
bun_uws_sys = { path = "../uws_sys" }
bun_sys = { path = "../sys" }
libc = "0.2"

[dev-dependencies]
bao_native_stubs = { path = "../bao_native_stubs" }
# Test-only: referencing force_link propagates liblsquic.a's native link
# dependency — the C socket closure (loop.c → quic.c) references lsquic
# symbols, and nothing else in bao_uloop's unit-test graph pulls it in.
bun_lsquic_sys = { path = "../lsquic_sys" }
# Test-only: pulls in bun_threading's rlib so its #[no_mangle] Bun__lock /
# Bun__unlock / Bun__lock__size exports (referenced by loop.c's DNS-result
# handling) resolve at link time.
bun_threading = { path = "../threading" }
# Test-only: pulls in bun_analytics' rlib so its #[no_mangle]
# Bun__isEpollPwait2SupportedOnLinuxKernel (referenced by epoll_kqueue.c)
# resolves at link time.
bun_analytics = { path = "../analytics" }
