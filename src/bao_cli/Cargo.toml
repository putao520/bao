[package]
name = "bao_cli"
version = "0.1.0"
description = "Bao CLI command dispatch — clap parsing + all run_* handlers"
edition.workspace = true
license.workspace = true
# The compat module include_str!s the four INVENTORY SSOTs from the repo
# tree (compat/*/INVENTORY.md) — a packaged copy of this crate could never
# resolve those paths, so this crate must never be published.
publish = false

[dependencies]
bun_runtime.workspace = true
bun_core.workspace = true
bao-browser = { path = "../bao_browser", version = "^0.3.0" }
bao_stealth = { path = "../bao_stealth", version = "^0.4.0" }
bao_bundler = { path = "../bao_bundler", version = "^0.2.0" }
bun_ast = { path = "../ast", version = "^0.2.0" }
bun_options_types = { path = "../options_types", version = "^0.2.0" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
