[package]
name = "bao-browser"
# crates.io name; lib target name pinned to `bao_browser` below so in-tree
# `bao_browser::` code and downstream re-exports are unchanged.
# 0.5.0 (2026-10-28): ws_registry face rework (d97f062c6).
# 0.1.1 (2026-08-19): PageState load_complete root fix (30cc90c9); servo =0.5.0 pins unchanged
# 0.1.2 (2026-08-19): terminal-gate re-stamp — same tree as 0.1.1
# (PageState load_complete 30cc90c9 already in 0.1.1); re-publish so
# registry consumers re-resolve the full 0.1.x dep set unambiguously.
# 0.1.3 (2026-08-19): wait_for_pipeline_ready pump-contract restored
# (c45aee6f): Phase 2 drives a pending navigation's load to completion
# (nav_seq-gated), so the verbatim README path1 snippet works as
# documented; servo =0.5.0 pins unchanged.
# 0.1.21 (2026-09-17): bun_runtime floor → ^0.2 via workspace dep (0.2.0
# breaking wave); same-wave sibling bumps beneath (bun_core/bao_engine/
# bao_stealth/bao_cdp_client).
version = "0.5.0"
edition = "2021"
description.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
name = "bao_browser"

[features]
# WPT official-toolchain face (REQ-BRW-002): links the upstream
# `webdriver_server` component and installs the servoshell-parity embedder
# host (webdriver_host.rs). Off by default for library consumers; bao_cli
# enables it so the `bao` binary is a wptrunner-launchable WebDriver server.
webdriver = ["dep:webdriver_server"]
# GStreamer media backend (packaging decision, 2026-10-21 根治波): servo's
# media backend is a compile-time three-way pick (servo.rs `media_platform`:
# gstreamer / ohos / dummy) — upstream design = product release shape, not a
# library default. bao is an embeddable library, so the default build now
# takes the pure-Rust face (DummyBackend + WebCodecs PCM/image backends —
# same shape the Windows leg already had) and gstreamer is opt-in for the
# desktop packager. Enabling it hard-links the 11 gstreamer-* system
# libraries into DT_NEEDED (gstreamer-rs system-deps has no dlopen mode), so
# the resulting artifact REQUIRES the gstreamer 1.18+ runtime on the target
# machine — ship the .so files yourself (scripts/package/desktop-linux.sh)
# or declare the system dependency (apt: libgstreamer1.0-0
# libgstreamer-plugins-base1.0-0 libgstreamer-plugins-bad1.0-0 ...). With
# the feature off, the artifact runs on a pristine Linux with zero gstreamer
# presence (media capability honestly degraded: canPlayType("") /
# isTypeSupported(false) — DummyBackend's existing upstream behaviour).
media-gstreamer = ["servo/media-gstreamer"]

[dependencies]
# webgl/webcrypto (e109 REQ-BRW-002 replay): the post-swap upstream snapshot
# gates the WebGL and Web Crypto exposure axes behind cargo features
# (`skip-unless CARGO_FEATURE_WEBGL`/`_WEBCRYPTO` in script_bindings webidls +
# `#[cfg(feature = "webgl")]` impl arms in script). Bao's product contract is
# that WebGL and crypto are always-on surfaces (stealth probing needs the real
# GL/crypto face present), so the features are enabled unconditionally here —
# the pre-swap snapshot compiled both in unconditionally.
# gamepad (REQ-BRW-30, 2026-10-16): the upstream snapshot gates the Gamepad
# exposure axis behind `skip-unless CARGO_FEATURE_GAMEPAD` in script_bindings
# webidls (Gamepad/GamepadButton/GamepadEvent/GamepadHapticActuator/
# Navigator.getGamepads compiled out otherwise => `undefined` at runtime).
# Bao's product contract is that the Gamepad API is an always-on surface
# (headless with no embedder-provided pads => getGamepads() returns an empty
# array, same as Chrome headless), so the feature is enabled unconditionally
# here. The target-gated servo declarations below (no-wgl) inherit it by
# cargo feature unification — no per-target repetition needed.
# Pure compile-time gate: gamepad = ["script/gamepad",
# "servo-constellation/gamepad", "embedder_traits/gamepad"] all forward to
# empty feature stubs, zero new crates/system libs.
# bluetooth (REQ-BRW-051, 2026-10-20): upstream ships the whole Web Bluetooth
# surface — 10 `Bluetooth*.webidl` files marked `skip-unless
# CARGO_FEATURE_BLUETOOTH`, `script/dom/bluetooth/` (Bluetooth/Device/GATTServer/
# GATTService/GATTCharacteristic/GATTDescriptor/AdvertisingEvent/UUID/TestRunner)
# and the `bao-servo-bluetooth` component — behind this non-default cargo
# feature. Without it the webidls are codegen-skipped, so `navigator.bluetooth`,
# `BluetoothUUID` and the whole GATT face are `undefined` (a fingerprintable
# API gap: real Chrome/Firefox expose them on every page). Enabled
# unconditionally, mirroring the webgl/webcrypto/gamepad precedent. The
# component's default cargo feature is `bluetooth-test` (blurmock mock
# backend, pure Rust); `native-bluetooth` (btleplug + OS stack) stays off —
# see the `dom_bluetooth_enabled` flip in `src/lib.rs` (`BrowserRuntime::new`).
# Feature fanout:
# servo-bluetooth-traits + servo-bluetooth + servo-constellation[-traits]/
# bluetooth + script/bluetooth (which pulls script_bindings/bluetooth).
# webcodecs (REQ-BRW-051, 2026-10-21): the WebCodecs exposure axis is gated the
# same way — 9 `webcodecs` webidl files (12 interfaces: AudioData/AudioDecoder/
# AudioEncoder/EncodedAudioChunk/EncodedVideoChunk/ImageDecoder/ImageTrack/
# ImageTrackList/VideoColorSpace/VideoDecoder/VideoEncoder/VideoFrame, the four
# codec control interfaces live in `WebCodecs.webidl`) carry `// skip-unless
# CARGO_FEATURE_WEBCODECS`, so without the feature codegen drops the whole set
# and the interfaces are `undefined` at runtime. Impl face is complete (12 DOM
# type modules under `script/dom/` + `webcodecs_error`/`webcodecs_pcm` helpers,
# each `#[cfg(feature = "webcodecs")]`-gated in `script/dom/mod.rs`; codegen
# materializes `crate::dom::<iface.lower()>::<Iface>`, matching one-for-one), so
# enable unconditionally, mirroring the webgl/webcrypto/gamepad precedent.
# Feature fanout: servo/webcodecs = script/webcodecs = script_bindings/webcodecs
# (webidl codegen gate) + dep bao-servo-webcodecs (decode plane, default
# features empty => pure Rust). The GStreamer video/audio backend rides on the
# `media-gstreamer` feature below (packaging decision, not a build default);
# without it every platform gets the pure-Rust control/PCM/image backends
# (CLAUDE.md Windows 交叉编译准入律).
servo = { path = "../../vendor/servo/components/servo", package = "bao-servo", version = ">=0.5.25, <0.6.0", default-features = false, features = ["baked-in-resources", "webgl", "webcrypto", "gamepad", "bluetooth", "webcodecs"] }
# WebDriver embedder host (feature "webdriver"): the upstream component that
# owns the whole WebDriver HTTP protocol — bao only pumps the embedder channel.
webdriver_server = { package = "bao-servo-webdriver-server", path = "../../vendor/servo/components/webdriver_server", version = ">=0.5.19, <0.6.0", optional = true }
# REQ-ARCH-3 (F2a): the webdriver_server embedder interface channel types
# (Sender<()> for input events / screenshots and the host receiver) are now
# spelled through `bao_ipc`'s transparent re-export — `bao_ipc::Sender` IS
# `crossbeam_channel::Sender` (same nominal type), so the servo component's
# API contract is unchanged; the direct crossbeam-channel dependency is
# dropped (single import point).
servo-url = { path = "../../vendor/servo/components/url", package = "bao-servo-url", version = ">=0.5.9, <0.6.0" }
dpi = "0.1"
url = "2"
# REQ-CDP-006 拦截面(X.8 裁定① 2026-10-14):fulfill 臂构造
# `WebResourceResponse{status_code, headers}` 需要 `http` crate 类型 ——
# servo 只 glob re-export `embedder_traits` 的项,`http` 是其私有依赖,
# 全树无 re-export。embedder_traits 自 pin `http = { version = "1.4" }`,
# 1.4.1 已在主 lock(零新增编译节点)。
http = "1.4"
dashmap.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
serde_json = "1"
bao_cdp = { path = "../bao_cdp", version = "0.5.0" }
bao_cdp_client = { path = "../bao_cdp_client", version = "^0.6.0" }
# REQ-ARCH-3 (wave F2a): unified MPMC message substrate — the bridge-surface
# channel family (servo events / worker ports / runtime bridge) imports
# `bao_ipc::{channel, unbounded, Sender, Receiver}` instead of touching
# crossbeam-channel directly, so the substrate stays swappable at one place.
bao_ipc = { path = "../bao_ipc", version = "0.1.0" }
bao_stealth = { path = "../bao_stealth", version = "^0.4.0" }
# sibling 精确下限(用户裁决 2026-09-02):memory_stats/realm_policy 等消费 bao_engine 0.1.16
bao_engine = { path = "../bao_engine", version = "^0.3.0" }
bun_runtime.workspace = true
bun_http.workspace = true
cdp-server = { path = "../cdp-server", version = "0.2.1" }
bun_core.workspace = true
bun_sys.workspace = true
mozjs = { path = "../../vendor/mozjs/mozjs", package = "bao-mozjs", version = "^0.24" }
serde = "1"
cookie = { package = "cookie", version = "0.18" }
log = "0.4"
euclid = "0.22"

# win-cross, #18 (media 门控裁决): glib/gstreamer 是 pkg-config 系统库,无 MSVC
# 交叉构建路径 — windows target 不启用 servo 的 media-gstreamer 后端(baked-in-
# resources 保持全 target)。2026-10-21 根治波:非 windows 同样不再默认启用——
# gstreamer 从「库默认硬链」翻转为「打包决策」(三平台一致形态),由上方
# `media-gstreamer` feature 由最终打包者开启;默认 Linux/非 windows 构建与
# Windows 腿同形 = 纯 Rust 媒体面(DummyBackend),零 gstreamer DT_NEEDED。
# 此 target 段不再存在:历史上它给非 windows 腿无条件注入 media-gstreamer。

# win-cross GL backend selection (Windows GL context class root fix): surfman's
# WGL backend restores the *previous* (null) context when `create_context`
# returns (scoped `CurrentContextGuard`, surfman wgl/device.rs), but servo's
# `SurfmanRenderingContext::new` (vendor/servo components/shared/paint/
# rendering_context.rs) loads gleam/glow right after `create_context` without a
# `make_context_current` — so `glGetString(GL_VERSION)` runs with no current
# context and glow panics "Reading GL_VERSION failed" (glow native.rs:69). The
# EGL/ANGLE surfman backends leave the context current inside `create_context`,
# which is the behaviour the servo code assumes. Upstream servoshell selects the
# ANGLE backend on Windows for exactly this reason (ports/servoshell/Cargo.toml:
# `surfman = { features = ["sm-angle-default"] }`); servo's `no-wgl` feature maps
# there (components/servo: no-wgl = mozangle/egl + mozangle/build_dlls +
# surfman/sm-angle-default + paint_api/no-wgl). ANGLE renders over D3D11, so the
# NVIDIA WGL ICD (nvoglv64.dll) never loads — which also removes the
# nvoglv64+0xa597db 0xC0000005 teardown class observed on consecutive GL tests.
# cfg(windows)-gated because mozangle's build.rs panics on non-Windows targets
# when egl/build_dlls are on; Linux keeps its X11/EGL path byte-identical.
[target.'cfg(windows)'.dependencies]
servo = { path = "../../vendor/servo/components/servo", package = "bao-servo", version = ">=0.5.25, <0.6.0", default-features = false, features = ["baked-in-resources", "no-wgl"] }

# Host-process signal exit (REQ-CLI-002 e184): the webdriver host process must
# terminate on SIGTERM/SIGINT — e177/e184: TERM closed the HTTP face but left
# the browser process spinning a core, because nothing wired the signal to the
# pump's exit. signal-hook-registry is the chaining registry tokio's own signal
# face routes through: bao's action and the server thread's tokio action share
# one trampoline regardless of registration order (a raw libc::sigaction would
# be silently replaced by the later tokio install). unix-only: the defect
# domain is the POSIX WPT vehicle; Windows console ctrl handling is a separate
# face.
[target.'cfg(unix)'.dependencies]
signal-hook-registry = "1.4"
# Watchdog liveness bound: _exit(2) skips a wedged atexit/teardown path.
libc = "0.2"

[dev-dependencies]
bao_engine = { path = "../bao_engine", version = "^0.3.0" }
# bao_cli_timeout_e2e_tests: kill(child, SIGINT) delivery for the
# SIGINT→cancel / default-kill negative-control subprocess tests.
libc = "0.2"
# page_wss_bao_tls_e2e_tests: local TLS WS fixture (BoringSSL server +
# bun_uws RFC 6455 codec) driving the page wss path end-to-end.
bao_boringssl_bridge.workspace = true
# page_net_bun_full_matrix_e2e_tests: SSL_CTX_set_alpn_select_cb +
# SSL_TLSEXT_ERR_* for the h2 fixture's ALPN negotiation (same sys leg the
# bridge itself uses).
bun_boringssl_sys.workspace = true
bun_uws.workspace = true
# page_net_bun_fingerprint_e2e_tests: drives servo-net's bun_bridge flag /
# request counter from the e2e harness (same path dep servo uses — unified).
servo-net = { path = "../../vendor/servo/components/net", package = "bao-servo-net", version = ">=0.5.35, <0.6.0" }
# h2_fetch_node_stack_e2e_tests: bun_url::URL + bun_threading Batch for the
# AsyncHTTP harness (the exact wire path window.fetch drives —
# fetch_async::start).
bun_url.workspace = true
bun_threading.workspace = true
# network_loading_finish_live_tests: gzip 压缩助手 — REQ-CDP-006 criterion #4
# 判别锁(wire 字节 vs decoded 字节)需要 fixture 产真实 gzip 流
# (flate2 workspace pin,rust_backend 与 bao_runtime 同后端)。
flate2.workspace = true
# link_higher_tier_seams (#28, win-cross lld-link): bun_bundler's CYCLEBREAK
# faces (`JSBundlerPlugin__*` / `DevServerHandle__Bake__*` /
# `VmLoaderCtx__Runtime__*` / `__bun_macro_context_*` / HMR) are owned by
# `bao_bundler`, but nothing in a dep closure loads that crate (its only
# referencers are cfg(test) seams), so rustc never puts its rlib on the test
# link line. GNU ld's --gc-sections discards the dead referencing sections
# (Linux links green); lld-link + /OPT:NOREF retains them → undefined-symbol
# storm. Dev-dep + the cfg(test) seam below put the owner crate on the link
# line; archive lazy-pull then resolves every face. No cycle: bao_bundler's
# closure never contains bao_browser. Twin: bao_engine / bao_stealth.
bao_bundler = { path = "../bao_bundler", version = "^0.2.0" }
