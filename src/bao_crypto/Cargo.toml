[package]
name = "bao_crypto"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
sha2 = { version = "0.10", features = ["oid"] }
sha1 = { version = "0.10", features = ["oid"] }
hmac = "0.12"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
ecdsa = { version = "0.16", features = ["signing", "verifying", "pkcs8"] }
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
x509-cert = "0.3.0-rc.4"
pkcs8 = { version = "0.10", features = ["pem", "alloc"] }
pkcs1 = { version = "0.7", features = ["pkcs8", "pem"] }
pem-rfc7468 = "0.7"
hkdf = "0.12"
getrandom = "0.4"
rand_core = "0.6"
signature = "2"
elliptic-curve = { version = "0.13", features = ["sec1"] }
thiserror.workspace = true
