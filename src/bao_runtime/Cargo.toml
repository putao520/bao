[package]
name = "bun_runtime"
version = "0.1.0"
description = "Bao runtime integration — JS engine + Bun API + event loop"
edition.workspace = true
license.workspace = true

[dependencies]
bao_engine = { path = "../bao_engine" }
bao_stealth = { path = "../bao_stealth" }
bao_boringssl_bridge = { path = "../bao_boringssl_bridge" }
bun_boringssl_sys = { path = "../boringssl_sys" }
bao_crypto = { path = "../bao_crypto" }
mozjs.workspace = true
mozjs_sys.workspace = true
log = "0.4"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
libffi = "3"
serde_json = "1"

# C library symbol providers (pure Rust replacements)
bao_native_stubs = { path = "../bao_native_stubs" }

# Package manager (auto-install, lockfile, npm registry)
bun_install = { path = "../install" }

# Bun 纯 Rust crate（L0-L3 层，零 JSC 依赖）
bun_http = { path = "../http" }
bun_http_types = { path = "../http_types" }
bun_core = { path = "../bun_core" }
bun_url = { path = "../url" }
bun_uws = { path = "../uws" }
bun_uws_sys = { path = "../uws_sys" }
bun_spawn = { path = "../spawn" }
bun_spawn_sys = { path = "../spawn_sys" }
bun_sys = { path = "../sys" }
bun_opaque = { path = "../opaque" }
bun_picohttp = { path = "../picohttp" }
bun_resolver = { path = "../resolver" }
bun_ast = { path = "../ast" }
bun_event_loop = { path = "../event_loop" }
bun_dns = { path = "../dns" }
bun_io = { path = "../io" }
bun_base64 = { path = "../base64" }
bun_s3_signing = { path = "../s3_signing" }
bytes.workspace = true
compact_str.workspace = true
smallvec.workspace = true
bao_uloop = { path = "../bao_uloop" }
bun_sha_hmac = { path = "../sha_hmac" }
hex = "0.4"
flate2.workspace = true

[dev-dependencies]
bao_engine = { path = "../bao_engine" }
bao_uloop = { path = "../bao_uloop" }
bao_cdp = { path = "../bao_cdp" }
cdp-server = { path = "../cdp-server" }
tempfile = "3"
