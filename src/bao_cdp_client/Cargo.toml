[package]
name = "bao_cdp_client"
version = "0.1.0"
rust-version = "1.85"
authors = ["Bao Project"]
edition = "2021"
license = "MIT OR MPL-2.0"
description = "Unified browser control client over CDP — integrates servo (in-memory) and external Chrome (WebSocket), Playwright-style high-level API."
repository = "https://github.com/putao520/bao"
documentation = "https://docs.rs/bao_cdp_client"
readme = false
keywords = ["cdp", "chrome-devtools", "servo", "browser-automation", "playwright"]
categories = ["api-bindings", "asynchronous", "development-tools::testing", "web-programming"]

# docs.rs 配置:启用全部 feature 生成文档
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Bao ecosystem dependencies (Bun 适配 Servo; 不引入 tokio)
bao_engine = { path = "../bao_engine", version = "0.1.0" }
bao_cdp = { path = "../bao_cdp", version = "0.1.0" }
bun_base64 = { path = "../base64", version = "0.1.0" }
bun_event_loop = { path = "../event_loop", version = "0.1.0" }
bun_url = { path = "../url", version = "0.1.0" }
# REQ-CDP-UWS-001: WebSocket transport now uses bun_uws::ws_client (RFC 6455
# codec + masking + handshake), removing the hand-written mask/encode layer.
bun_uws = { path = "../uws", version = "0.1.0" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging (Bun workspace 标准)
log = "0.4"

# CDP protocol types (chromiumoxide 上游同款)
cdp-protocol = "0.3"

[lib]
name = "bao_cdp_client"
path = "src/lib.rs"

# 示例代码 — 演示 bao_cdp_client 公共 API 的使用模式。
#
# 每个示例对应一种典型场景:
# - basic_usage:        最小化连接 + 截图(memory:// servo)
# - external_chrome:    连接外部 Chrome / Chromium(ws://)
# - multi_page:         多 tab 管理(Page pool)
# - event_listener:     监听 console / network 事件
# - cookies:            Cookie 添加 / 查询 / 删除
[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "external_chrome"
path = "examples/external_chrome.rs"

[[example]]
name = "multi_page"
path = "examples/multi_page.rs"

[[example]]
name = "event_listener"
path = "examples/event_listener.rs"

[[example]]
name = "cookies"
path = "examples/cookies.rs"

# CDP conformance 审计测试 — 对照 Chrome DevTools Protocol 官方规范审计
# bao_cdp_client 193 method 的返回值 schema / 错误码 / 事件序列。
#
# 按域分文件(Page/Runtime/DOM/Network/Input/Emulation/Target/CSS/Log/Debugger),
# 每个文件覆盖该域所有 method 的 conformance 检查。
#
# @trace REQ-CDP-001 [level:integration]
# @trace REQ-CDP-002 [level:integration]
# @trace REQ-CDP-003 [level:integration]
[[test]]
name = "cdp_conformance"
path = "tests/cdp_conformance/main.rs"
