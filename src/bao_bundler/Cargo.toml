[package]
name = "bao_bundler"
version = "0.1.0"
description = "SpiderMonkey CYCLEBREAK bridge for bun_bundler — provides SM-backed link-time symbols and dispatch interfaces"
edition.workspace = true
license.workspace = true

[dependencies]
# Core dependency: reuse ALL bundler logic, only provide SM implementations
# for the CYCLEBREAK symbols and dispatch interfaces.
bun_bundler = { path = "../bundler" }
bao_engine = { path = "../bao_engine" }
bun_runtime.workspace = true
bun_core = { path = "../bun_core" }
bun_event_loop = { path = "../event_loop" }
bun_io = { path = "../io" }
bun_resolver = { path = "../resolver" }
bun_watcher = { path = "../watcher" }
bun_options_types = { path = "../options_types" }
bun_ast = { path = "../ast" }
bun_collections = { path = "../collections" }

[lints]
workspace = true
