[package]
name = "bao"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Bao unified library — SpiderMonkey + servo + Node/Bun API + CDP + Stealth (always-on full stack)"
repository.workspace = true
keywords = ["browser", "spidermonkey", "servo", "cdp", "stealth"]
categories = ["web-programming", "development-tools", "api-bindings"]
readme = "README.md"

[lib]
name = "bao"
path = "src/lib.rs"

# Full stack always linked. No product *capability* features (browser/CDP/stealth).
# Stealth / Permission optionality is runtime config only.
#
# Engineering feature `native-stubs` (NON-default): force-link the residual
# bao_native_stubs crate from this facade. Default product path does NOT
# directly depend on or force-link stubs (see STUB-INVENTORY.md). Residual
# symbols still arrive transitively via bun_runtime until P0 owners finish.
[features]
default = []
native-stubs = ["dep:bao_native_stubs"]

[dependencies]
bao_browser = { path = "../bao_browser" }
bao_engine = { path = "../bao_engine" }
bun_runtime = { path = "../bao_runtime" }
bao_cdp = { path = "../bao_cdp" }
bao_cdp_client = { path = "../bao_cdp_client" }
bao_stealth = { path = "../bao_stealth" }
bao_uloop = { path = "../bao_uloop" }
bao_native_stubs = { path = "../bao_native_stubs", optional = true }

[lints]
workspace = true
