[package]
# crates.io name (`bao` is taken by the BLAKE3 project). The lib target name
# stays `bao` below, so in-tree `bao::` code and downstream `use bao::` are
# unchanged; only the published package/version identity moves to bao-core.
name = "bao-core"
# 0.0.2 (2026-08-19): README facade docs refresh (6a29ca8e/9574254e) +
# full 0.1.1 dep-tree convergence beneath.
version = "0.1.9"
edition.workspace = true
license.workspace = true
description = "Bao unified library — SpiderMonkey + servo + Node/Bun API + CDP + Stealth (always-on full stack)"
repository.workspace = true
keywords = ["browser", "spidermonkey", "servo", "cdp", "stealth"]
categories = ["web-programming", "development-tools", "api-bindings"]
readme = "README.md"

[lib]
name = "bao"
path = "src/lib.rs"

# Full stack always linked. No product *capability* features (browser/CDP/stealth).
# Stealth / Permission optionality is runtime config only.
#
# Product never depends on or force-links bao_native_stubs (no native-stubs feature).
# Residual symbols arrive via real owners (product_process_exit / product_buffered_reader /
# product_native_symbols / bun_*) — see STUB-INVENTORY.md.
[features]
default = []

[dependencies]
bao-browser = { path = "../bao_browser", version = "0.1.0" }
bao_engine = { path = "../bao_engine", version = "0.1.0" }
bun_runtime = { path = "../bao_runtime", version = "0.1.0" }
bao_cdp = { path = "../bao_cdp", version = "0.1.0" }
bao_cdp_client = { path = "../bao_cdp_client", version = "0.1.0" }
bao_stealth = { path = "../bao_stealth", version = "0.1.0" }
bao_uloop = { path = "../bao_uloop", version = "0.1.0" }

[lints]
workspace = true
