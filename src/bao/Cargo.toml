[package]
# crates.io name (`bao` is taken by the BLAKE3 project). The lib target name
# stays `bao` below, so in-tree `bao::` code and downstream `use bao::` are
# unchanged; only the published package/version identity moves to bao-core.
name = "bao-core"
# 0.1.15 (2026-09-17): same-wave sibling floors — bun_runtime ^0.2 (0.2.0
# BREAKING wave), bao_engine ^0.1.18 / bao-browser ^0.1.21 / bao_cdp_client
# ^0.1.16 / bao_stealth ^0.1.17.
# 0.0.2 (2026-08-19): README facade docs refresh (6a29ca8e/9574254e) +
# full 0.1.1 dep-tree convergence beneath.
version = "0.3.13"
edition.workspace = true
license.workspace = true
description = "Bao unified library — SpiderMonkey + servo + Node/Bun API + CDP + Stealth (always-on full stack)"
repository.workspace = true
keywords = ["browser", "spidermonkey", "servo", "cdp", "stealth"]
categories = ["web-programming", "development-tools", "api-bindings"]
readme = "README.md"

[lib]
name = "bao"
path = "src/lib.rs"

# Full stack always linked. No product *capability* features (browser/CDP/stealth).
# Stealth / Permission optionality is runtime config only.
#
# Product never depends on or force-links bao_native_stubs (no native-stubs feature).
# Residual symbols arrive via real owners (product_process_exit / product_buffered_reader /
# product_native_symbols / bun_*) — see stub-inventory 清单文档.
#
# media-gstreamer (2026-10-21 根治波): transparent pass-through to bao-browser.
# The default build is pure-Rust media (DummyBackend + WebCodecs PCM/image
# backends, deployable on a pristine Linux with zero gstreamer presence);
# enabling this feature opt-in the GStreamer backend for desktop packaging —
# it hard-links the 11 gstreamer-* system libraries (gstreamer-rs system-deps
# has no dlopen mode), so the artifact must ship the .so files or declare the
# system dependency. See scripts/package/desktop-linux.sh.
[features]
default = []
media-gstreamer = ["bao-browser/media-gstreamer"]

[dependencies]
# sibling 精确下限(用户裁决 2026-09-02):同波同版下限 — re-export 整栈,
# 全部同波 sibling 下限 = 本波新版本。
bao-browser = { path = "../bao_browser", version = "^0.4.0" }
bao_engine = { path = "../bao_engine", version = "^0.3.0" }
bun_runtime = { path = "../bao_runtime", version = "^0.5" }
bao_cdp = { path = "../bao_cdp", version = "0.4.0" }
bao_cdp_client = { path = "../bao_cdp_client", version = "^0.5.0" }
bao_stealth = { path = "../bao_stealth", version = "^0.4.0" }
bao_uloop = { path = "../bao_uloop", version = "0.2.0" }

[dev-dependencies]
bao_crypto = { path = "../bao_crypto" }
bun_sm = { path = "../bun_sm" }
bun_transpiler = { path = "../transpiler" }
serde_json = "1"

[lints]
workspace = true
