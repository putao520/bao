[package]
name = "bao"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Bao unified library — SpiderMonkey + servo + Node/Bun API + CDP + Stealth (always-on full stack)"
repository.workspace = true
keywords = ["browser", "spidermonkey", "servo", "cdp", "stealth"]
categories = ["web-programming", "development-tools", "api-bindings"]
readme = "README.md"

[lib]
name = "bao"
path = "src/lib.rs"

# Full stack always linked. No product *capability* features (browser/CDP/stealth).
# Stealth / Permission optionality is runtime config only.
#
# Product never depends on or force-links bao_native_stubs (no native-stubs feature).
# Residual symbols arrive via real owners (product_process_exit / product_buffered_reader /
# product_native_symbols / bun_*) — see STUB-INVENTORY.md.
[features]
default = []

[dependencies]
bao_browser = { path = "../bao_browser" }
bao_engine = { path = "../bao_engine" }
bun_runtime = { path = "../bao_runtime" }
bao_cdp = { path = "../bao_cdp" }
bao_cdp_client = { path = "../bao_cdp_client" }
bao_stealth = { path = "../bao_stealth" }
bao_uloop = { path = "../bao_uloop" }

[lints]
workspace = true
