[package]
name = "bun_sm"
# 0.1.1 (2026-08-19): explicit version — breaks workspace inheritance
# so this patch release ships alone. spawn watch loop-alive + exit double-dispatch root fix.
version = "0.1.7"
description = "SpiderMonkey-backed API compatibility layer replacing bun_jsc"
edition.workspace = true
license.workspace = true

[dependencies]
# NOTE: bun_sm is the bottom layer — it does NOT depend on bao_engine.
# bao_engine depends on bun_sm and re-exports its types.
bao_engine_macros = { path = "../bao_engine_macros", version = "0.1.0" }
mozjs.workspace = true
mozjs_sys.workspace = true
bun_core = { path = "../bun_core", version = "0.1.0" }
bun_event_loop = { path = "../event_loop", version = "0.1.0" }
bun_io = { path = "../io", version = "0.1.0" }
bun_collections = { path = "../collections", version = "0.1.0" }
bun_threading = { path = "../threading", version = "0.1.0" }
bun_sys = { path = "../sys", version = "0.1.0" }
bun_transpiler = { path = "../transpiler", version = "0.1.0" }
libc = "0.2"
log = "0.4"

[dev-dependencies]
bao_engine = { path = "../bao_engine", version = "0.1.0" }
bun_runtime = { path = "../bao_runtime", version = "0.1.0" }
tempfile = "3"

[lints.rust]
unused_imports = "allow"
