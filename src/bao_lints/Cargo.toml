[package]
name = "bao_lints"
version = "0.2.1" # explicit: bumps independent of workspace-inherited 0.1.0 (W39)
edition.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true
description = "Format-immune AST-based detector for BCE-012 GC-unsafe Handle construction patterns"

[lib]
name = "bao_lints"
path = "src/lib.rs"

[[bin]]
name = "bao_lints"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit", "parsing"] }
walkdir = "2"
proc-macro2 = { version = "1", features = ["span-locations"] }
