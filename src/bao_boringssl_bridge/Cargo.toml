description = "BoringSSL-backed TLS for Bao runtime (replaces bao_tls/rustls)"
edition.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true

[dependencies]
bun_boringssl = { path = "../boringssl", version = "0.1.0" }
bun_boringssl_sys = { path = "../boringssl_sys", version = "0.1.0" }
