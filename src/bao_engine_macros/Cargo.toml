[package]
name = "bao_engine_macros"
# 0.2.0 (2026-10-28): de-inherited from workspace version ("0.1.0" is shared
# by 12 crates and must not move with this one). Breaking proc-macro behavior
# (a8092be46): JsClass no longer generates `impl HostObject` — consumers must
# provide `JsClassOps::HOST_CLASS` (BCE-20261025-FFI-SLOT-GATE class gate).
version = "0.2.0"
description = "Proc-macros for bao_engine host function registration"
edition.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }
