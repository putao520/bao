name: Bug report
description: Report something that works incorrectly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Before posting, please:
        - Run `bao doctor` and paste its output below.
        - Search existing issues to avoid duplicates.
        - For security vulnerabilities, do **not** use this template — see
          [SECURITY.md](../../SECURITY.md) for private disclosure.

  - type: input
    id: bao-version
    attributes:
      label: Bao version
      description: Output of `bao --version` (or the commit if building from source)
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "e.g. Ubuntu 24.04, x86_64, kernel 6.x"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: `bao doctor` output
      description: Paste the full output of `bao doctor` — it captures the toolchain state we need.
      render: shell
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal reproducible script. The smaller, the faster we can help.
      placeholder: |
        1. `bao browser --url ...`
        2. ...
        ```js
        // repro script
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include any error output / stack trace / SIGSEGV signal.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Runtime (BaoRuntime / PagePool)
        - Browser engine (Servo / rendering)
        - Node/Bun API compatibility
        - CDP / automation
        - Browser identity & privacy
        - CLI
        - Build / toolchain
        - other
    validations:
      required: true
