name: Browser Smoke

# Full smoke test — 手动 / 每周定期触发(不在每个 PR 跑,因为 mozjs 首次编译 30+ 分钟)。
#
# 目标:验证 `bao browser` 子命令能真正启动 servo + CDP Server + navigate + screenshot。
# 这是 OSS badge:"Bao 浏览器能跑"。
#
# 需要 Xvfb 虚拟 DISPLAY(servo WebRender 是 GL-based,headless 也要 DISPLAY)。
#
# @trace REQ-BRW-001 (servo 浏览器集成)
# @trace REQ-CDP-001 (CDP Server 基础)

on:
  workflow_dispatch:      # 手动触发(Actions 标签页 Run workflow)
  schedule:
    - cron: '0 4 * * 1'   # 每周一 04:00 UTC(北京时间周一 12:00)

env:
  CARGO_BUILD_JOBS: 1
  CARGO_NET_RETRY: 3
  RUSTUP_MAX_RETRIES: 3
  # servo WebRender 需要 DISPLAY,即使 headless;Xvfb 提供
  DISPLAY: :99

jobs:
  smoke:
    name: bao browser navigate + screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install C/C++ + servo 渲染依赖(servo WebRender 需要 GL/EGL/Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang pkg-config libssl-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libgtk-3-0 libgbm1 libasound2

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-smoke-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-smoke-
            ${{ runner.os }}-cargo-

      - name: Cache target/ (含 mozjs 构建产物)
        uses: actions/cache@v4
        with:
          path: |
            target
            !target/**/*.pdb
          key: ${{ runner.os }}-target-smoke-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-target-smoke-
            ${{ runner.os }}-target-

      # Generate codegen stubs (required by bun_core/build.rs before building).
      - name: Ensure codegen stubs
        run: ./scripts/ensure-codegen.sh

      # 首次构建 bao_bin 极慢(mozjs 编译 SpiderMonkey 20-40 分钟),timeout 已设 90min
      - name: Build bao_bin (--jobs 1, debug)
        run: cargo build --jobs 1 -p bao_bin

      # 启动 Xvfb 虚拟 DISPLAY,servo WebRender 需要 GL context
      - name: Start Xvfb (DISPLAY :99)
        run: |
          Xvfb :99 -screen 0 1280x720x24 -ac -nolisten tcp &
          sleep 2
          # 验证 Xvfb 在跑
          if ! pgrep -x Xvfb >/dev/null; then
            echo "::error::Xvfb failed to start"
            exit 1
          fi
          echo "Xvfb started on :99"

      - name: Smoke — bao doctor(环境自检,informational)
        run: ./target/debug/bao doctor || true

      # 后台启动 bao browser,等 CDP Server 监听 9222
      - name: Launch bao browser + wait for CDP
        run: |
          set -euo pipefail
          # 后台启动,日志落 bao.log
          ./target/debug/bao browser --cdp-port 9222 --url https://example.com > bao.log 2>&1 &
          BAO_PID=$!
          echo "bao browser PID=$BAO_PID"
          echo "$BAO_PID" > bao.pid

          # 轮询 /json/version,最长等 60s
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
              echo "CDP Server up after ${i}s"
              curl -s http://127.0.0.1:9222/json/version | head -c 500
              echo
              exit 0
            fi
            # 进程崩了直接退出
            if ! kill -0 "$BAO_PID" 2>/dev/null; then
              echo "::error::bao browser exited before CDP came up. Log:"
              cat bao.log
              exit 1
            fi
            sleep 1
          done
          echo "::error::CDP Server did not come up within 60s. Log:"
          cat bao.log
          exit 1

      - name: Smoke — /json/list (target 列表)
        run: |
          set -euo pipefail
          echo "=== /json/list ==="
          curl -sf http://127.0.0.1:9222/json/list | head -c 1000
          echo

      - name: Smoke — bao evaluate(取 document.title)
        run: |
          set -euo pipefail
          # 等几秒让 navigate 完成
          sleep 5
          TITLE=$(./target/debug/bao run -e 'console.log(typeof document)' 2>&1 || echo "n/a")
          echo "script output: $TITLE"

      - name: Cleanup bao browser
        if: always()
        run: |
          if [ -f bao.pid ]; then
            PID=$(cat bao.pid)
            kill "$PID" 2>/dev/null || true
            sleep 1
            kill -9 "$PID" 2>/dev/null || true
          fi

      - name: Upload bao.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bao-browser-smoke-log
          path: bao.log
          retention-days: 14
