name: CI

# Fast CI — 每个 PR / push 跑。目标:验证格式 + 核心 crate 编译通过。
# 不跑全 workspace clippy(mozjs 编译 SpiderMonkey 太慢,30+ 分钟);
# 只验证 bao_bin CLI 链路(bao_engine → bao_browser → bao_cdp → bao_cli → bao_bin)能编译。
#
# 重型 smoke(browser navigate + Playwright CDP)放 browser-smoke.yml / cdp-smoke.yml,
# 手动或定期触发。
#
# @trace REQ-ENG-001 (SpiderMonkey 引擎链路编译验证)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  # mozjs 从源码编译 SpiderMonkey,EBUSY patch + 单线程编译避免 race
  CARGO_BUILD_JOBS: 1
  CARGO_NET_RETRY: 3
  RUSTUP_MAX_RETRIES: 3

jobs:
  fmt:
    name: cargo fmt (historical debt — non-blocking)
    runs-on: ubuntu-latest
    # ~8000 historical formatting diffs across bao_* (long run without fmt).
    # Report-only until the debt is cleared in a dedicated formatting PR.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt

      - name: "cargo fmt --check (no --all: --all recurses into vendor/servo)"
        run: cargo fmt -- --check

  check:
    name: cargo check (bao_bin 链路)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20

      - name: Install C/C++ toolchain + pkg-config (mozjs 从源码编译 SpiderMonkey 需要)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang pkg-config libssl-dev libdeflate-dev

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-
            ${{ runner.os }}-cargo-

      - name: Cache target/ (含 mozjs 构建产物,首次 20-40 分钟,缓存后秒级)
        uses: actions/cache@v4
        with:
          path: |
            target
            !target/**/*.pdb
          key: ${{ runner.os }}-target-check-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-target-check-
            ${{ runner.os }}-target-

      # Generate the Bao codegen stubs (bun_core/build.rs requires them; Bun
      # upstream generates via `bun bd`, Bao uses deterministic SM-migration stubs).
      - name: Ensure codegen stubs
        run: ./scripts/ensure-codegen.sh

      # --jobs 1 是 CLAUDE.md 铁律(mozjs EBUSY patch 在 libtest 线程池下需要单线程编译)
      # 只 check bao_bin(bao_engine + bao_browser + bao_cdp + bao_cli 链路);
      # vendor/servo 在 workspace 外,不需要 check。
      - name: cargo check bao_bin (--jobs 1)
        run: cargo check --jobs 1 -p bao_bin

      # 同时验证 bao_browser(servo 集成桥)能 check,这是最常因为 servo API 变动崩的部分
      - name: cargo check bao_browser (--jobs 1)
        run: cargo check --jobs 1 -p bao_browser

  clippy:
    name: cargo clippy (bao_bin 链路)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
          components: clippy

      - name: Install C/C++ toolchain + pkg-config
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang pkg-config libssl-dev libdeflate-dev

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
            ${{ runner.os }}-cargo-

      - name: Cache target/
        uses: actions/cache@v4
        with:
          path: |
            target
            !target/**/*.pdb
          key: ${{ runner.os }}-target-clippy-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-target-clippy-
            ${{ runner.os }}-target-

      # Generate codegen stubs (required by bun_core/build.rs before any cargo step).
      - name: Ensure codegen stubs
        run: ./scripts/ensure-codegen.sh

      # TODO(后续优化): 初版允许 warnings 不阻断 PR,待核心 lint 清零后改 -D warnings
      # 只对 bao_bin 链路 clippy,避免对 vendor/bun_* 上游 crate 跑(那是外部维护的)
      - name: cargo clippy bao_bin (--jobs 1, 暂允许 warnings)
        run: cargo clippy --jobs 1 -p bao_bin --no-deps --lib --bins

  bce-gate:
    name: BCE gate (bce-check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Rust toolchain (stable, for bao_lints)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry (bao_lints 编译用)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-bao_lints-${{ hashFiles('src/bao_lints/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bao_lints-

      - name: Run BCE-012 GC-unsafe Handle scanner
        run: python3 scripts/bce_scan_gc_unsafe.py src/

      - name: Run bao_lints GC-unsafe AST detector
        run: cargo run -p bao_lints -- --check src/

      - name: Run bao_lints SPEC id-format detector
        run: cargo run -p bao_lints -- spec-id .spec/ --baseline .github/baseline-spec-id.txt
