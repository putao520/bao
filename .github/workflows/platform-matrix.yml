# Bao minimal platform matrix (issue #38; 2026-09-08 user rulings supersede the
# 2026-08-22 "CI stays local" decision — local scripts/local-ci.sh is untouched
# and remains the local gate).
#
# Scope (2026-09-08 user ruling): CI only verifies the heavily cross-platform
# crate set — the exact platform surfaces tracked in #33/#34/#35/#36:
#   bao_uloop · bun_uws_sys · bun_libuv_sys · bun_mimalloc_sys
#   `cargo check -p bao_uloop -p bun_uws_sys -p bun_libuv_sys -p bun_mimalloc_sys --locked`
# Closure verified locally: this set pulls none of mozjs / freetype / servo
# (the full-stack bao-core check was dropped: SpiderMonkey + freetype-sys
# rebuilds are hour-class on hosted runners and freetype-sys needs system
# libraries the bare runners lack — see #10 for the musl/dependency track).
# Full-stack verification stays on real machines and the #10 track.
#
#   1. ubuntu/macos: the command above — required gate.
#   2. windows: same command with continue-on-error — baseline probe recording
#      how far a Windows build gets (expected to fail at the #33 mimalloc wall).
#   3. Triggers are deliberately unfiltered (every push to master + every PR),
#      so any rust-toolchain.toml nightly bump automatically runs the full
#      matrix and can never skip the pin gate (#18 Scope D).
#
# No secrets; pure static build gate. The pinned toolchain is NOT duplicated
# here: `rustup toolchain install` with no argument installs the active
# toolchain, which rustup resolves from the checked-out rust-toolchain.toml
# (SSOT) — bumping that one file is all a pin-bump PR needs to do.
name: platform-matrix

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pushes/PR syncs cancel the previous run early.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The light crate set checks in minutes locally (closure-verified, no
    # mozjs/freetype/servo); 30min leaves ample headroom for cold caches.
    timeout-minutes: 30
    continue-on-error: ${{ matrix.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            allow-failure: false
            label: required gate
          - os: macos-latest
            allow-failure: false
            label: required gate
          - os: windows-latest
            allow-failure: true
            label: "baseline: expected to fail — see #33/#34/#35"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Installs exactly what rust-toolchain.toml pins (channel + components);
      # the pin lives only in that file — the workflow never restates it.
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # Keep the 10GB repo cache budget for the required gates; the Windows
      # baseline probe stays cacheless (it is expected to fail anyway).
      - name: Cache cargo (registry, git, target)
        uses: Swatinem/rust-cache@v2
        if: matrix.allow-failure == false

      - name: cargo check (cross-platform crate set) (${{ matrix.label }})
        run: cargo check -p bao_uloop -p bun_uws_sys -p bun_libuv_sys -p bun_mimalloc_sys --locked
