# BAO PATCH (issue #44 -> e128 2026-10-07 rebase): fork of the monorepo
# `style_derive` crate @ 0cb50925b, package renamed stylo_derive ->
# bao-stylo-derive. Delta vs monorepo: pinned `Ok::<(), ::std::fmt::Error>`
# tails in to_css.rs (E0282/E0283 `fmt::Error: From<_>` ambiguity when
# serde_fmt is in the dependency graph). Dep key stays `style_derive`
# (lib code does `use style_derive::...`).
[package]
name = "bao-stylo-derive"
version = "0.22.0"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
repository = "https://github.com/servo/stylo"
edition = "2024"
description = "Derive crate for Stylo CSS engine"

[lib]
path = "lib.rs"
proc-macro = true

[dependencies]
darling = { version = "0.20", default-features = false }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", default-features = false, features = ["clone-impls", "derive", "parsing"] }
synstructure = "0.13"
