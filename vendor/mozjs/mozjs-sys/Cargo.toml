[package]
# BAO PATCH (W0b publish fork): package renamed mozjs_sys -> bao-mozjs-sys for
# crates.io release; lib name stays `mozjs_sys` so downstream `use mozjs_sys::`
# keeps resolving. Dependents reach it via `package = "bao-mozjs-sys"` rename.
name = "bao-mozjs-sys"
description = "System crate for the Mozilla SpiderMonkey JavaScript engine."
repository.workspace = true
# 140.13.0-5 (2026-08-20): DWARF line-tables downgrade ships in-package
# (15a4a699): build.rs now pins MOZ_DEBUG_FLAGS="-gdwarf-4 -g1" so the
# mozjs C++ builds with DWARF4 line-tables without any user env/makefile.
version = "140.13.0-6"
authors = ["Mozilla", "The Servo Project Developers"]
links = "mozjs"
license.workspace = true
exclude = [
  "__pycache__",
  "/etc/",
  "/mozjs/.cargo/",
  # ── #42 拆分后 core 骨架域(#40 js 载荷排除已随迁移移交 src-js 卫星)──
  # NOTE: third_party/python 已整树迁往 src-python 卫星(#42);
  # /mozjs/config/tests 不可排——config/moz.build 无条件声明其 python.toml
  # (moz.build FILES 机制,非构建目标门;#40 dry-run oracle 实证)。
]
edition.workspace = true

[lib]
name = "mozjs_sys"
# The generated jsapi.rs contains #[doc] strings which look like
# doctests but are definitely not.
doctest = false

[features]
# BAO PATCH (#40 ⑤a): default feature set declared so `cargo publish`
# verification (which builds with default features only) passes the build.rs
# libz gate. Matches bao-mozjs's declared defaults exactly; servo consumes via
# default-features = false and is unaffected.
default = ["jit", "libz-sys", "intl"]
debugmozjs = []
profilemozjs = []
jit = []
jitspew = []
libz-sys = ["dep:libz-sys"]
libz-rs = ["dep:libz-rs-sys"]
intl = ["dep:icu_capi"]
crown = []
oom_with_hook = []

[dependencies]
libc.workspace = true
encoding_c = "0.9.8"
encoding_c_mem = "0.2.6"
# BAO PATCH (#42 split): source-slice satellites. Their build scripts export
# `cargo:root`, which cargo surfaces to THIS crate's build script as
# DEP_BAO_MOZJS_SRC_{JS,INTL,PYTHON}_ROOT; the build script synthesizes the
# virtual mozjs topsrcdir from the three roots + this crate's skeleton
# (mozjs/{build,config*,mozglue,mfbt,nsprpub,...}). Version-pinned lockstep
# with this crate (140.13.0-4 lineage) so `cargo package` rewrites cleanly.
bao-mozjs-src-js = { path = "../src-js", version = "=140.13.0-4" }
bao-mozjs-src-intl = { path = "../src-intl", version = "=140.13.0-4" }
bao-mozjs-src-python = { path = "../src-python", version = "=140.13.0-4" }
# unicode-bidi-ffi = { path = "./mozjs/intl/bidi/rust/unicode-bidi-ffi" }
# keep in sync with intl/icu_capi/Cargo.toml
icu_capi = { version = "=1.5.0", default-features = false, features = [
  "compiled_data",
  "icu_calendar",
  "icu_properties",
  "icu_segmenter",
], optional = true }

libz-rs-sys = { version = "0.5.1", features = [
  "export-symbols",
], optional = true }
# SM depends on them and we provide them using cargo
libz-sys = { version = "1.1.19", default-features = false, features = [
  "libc",
  "stock-zlib",
], optional = true }

[build-dependencies]
bindgen.workspace = true
cc.workspace = true
walkdir = "2"
flate2 = "1"
tar = "0.4"
