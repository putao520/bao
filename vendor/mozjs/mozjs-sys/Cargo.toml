[package]
# BAO PATCH (W0b publish fork): package renamed mozjs_sys -> bao-mozjs-sys for
# crates.io release; lib name stays `mozjs_sys` so downstream `use mozjs_sys::`
# keeps resolving. Dependents reach it via `package = "bao-mozjs-sys"` rename.
# BAO PATCH (2026-09-21 build-face unification): the vendor/mozjs workspace
# root is absorbed into the bao workspace — every `*.workspace = true` below is
# an inlined literal, byte-identical to the former vendor workspace root.
name = "bao-mozjs-sys"
description = "System crate for the Mozilla SpiderMonkey JavaScript engine."
repository = "https://github.com/servo/mozjs/"
# 140.13.0-5 (2026-08-20): DWARF line-tables downgrade ships in-package
# (15a4a699): build.rs now pins MOZ_DEBUG_FLAGS="-gdwarf-4 -g1" so the
# mozjs C++ builds with DWARF4 line-tables without any user env/makefile.
# 140.14.0-0 (2026-08-22): upstream SM 140.14.0 security bump (changeset
# ee9f2b2aedc3c58347d66ca8d7b9f92ef1df3f53, servo/mozjs#798) + rust-side
# #797/#800 absorbed.
# 140.14.0-1 (2026-09-16): content-repair republish — BAO patch#6
# BaoCollectRuntimeStats (jsglue.cpp, SM-EVOLUTION #27 裁决 6, a51a81ef
# 2026-09-10) shipped in-tree under 140.14.0-0 after the 2026-08-22
# registry upload; same-number content drift corrected by patch bump.
# 153.3.0-0 (2026-09-21): SM153 single-version forward port — source
# mozjs-source-3b49a449 (FIREFOX_153_3_0esr_RELEASE), wrapper/tooling anchor
# upstream 29ba7198 (#803); version lineage follows the SM (upstream:
# mozjs-sys-v153.0.0-x tags; bao pins the newest 153 ESR = 153.3.0).
version = "153.3.0-0"
authors = ["Mozilla", "The Servo Project Developers"]
links = "mozjs"
license = "MPL-2.0"
exclude = [
  "__pycache__",
  "/etc/",
  "/mozjs/.cargo/",
  # ── #42 拆分后 core 骨架域(#40 js 载荷排除已随迁移移交 src-js 卫星)──
  # NOTE: third_party/python 已整树迁往 src-python 卫星(#42);
  # /mozjs/config/tests 不可排——config/moz.build 无条件声明其 python.toml
  # (moz.build FILES 机制,非构建目标门;#40 dry-run oracle 实证)。
]
edition = "2021"

[lib]
name = "mozjs_sys"
# The generated jsapi.rs contains #[doc] strings which look like
# doctests but are definitely not.
doctest = false

[features]
# BAO PATCH (#40 ⑤a): default feature set declared so `cargo publish`
# verification (which builds with default features only) passes the build.rs
# libz gate. Matches bao-mozjs's declared defaults exactly; servo consumes via
# default-features = false and is unaffected.
default = ["jit", "libz-sys", "intl"]
debugmozjs = []
profilemozjs = []
jit = []
jitspew = []
libz-sys = ["dep:libz-sys"]
libz-rs = ["dep:libz-rs-sys"]
# SM153: intl now also pulls the extracted rust-glue crates (cbindgen headers
# flow into the SM build via DEP_*_GLUE_INCLUDE in build.rs; upstream 153 form).
intl = [
  "dep:icu_capi",
  "dep:mozjs_unicode_bidi_ffi",
  "dep:mozjs_properties_glue",
  "dep:mozjs_collator_glue",
  "dep:mozjs_locale_glue",
]
crown = []
oom_with_hook = []

[dependencies]
libc = "0.2"
encoding_c = "0.9.8"
encoding_c_mem = "0.2.6"
# BAO PATCH (#42 split): source-slice satellites. Their build scripts export
# `cargo:root`, which cargo surfaces to THIS crate's build script as
# DEP_BAO_MOZJS_SRC_{JS,INTL,PYTHON}_ROOT; the build script synthesizes the
# virtual mozjs topsrcdir from the three roots + this crate's skeleton
# (mozjs/{build,config*,mozglue,mfbt,nsprpub,...}). Version-pinned lockstep
# with this crate (140.14.0-0 lineage) so `cargo package` rewrites cleanly.
bao-mozjs-src-js = { path = "../src-js", version = "=153.3.0-0" }
bao-mozjs-src-intl = { path = "../src-intl", version = "=153.3.0-0" }
bao-mozjs-src-python = { path = "../src-python", version = "=153.3.0-0" }
# SM153 (upstream 29ba7198 form): the SM tree's rust glue crates are vendored
# in-tree by upstream; the filters exclude them and update.py extracts them to
# ../mozjs-extracted-crates (self-pinned to the SM milestone 153.3.0). The
# glue crates' build.rs scripts emit cargo:include, surfaced here as
# DEP_<links>_INCLUDE for the SM C++ build. normalizer_glue is non-optional
# (build.rs requires DEP_NORMALIZER_GLUE_INCLUDE unconditionally, upstream).
mozjs_unicode_bidi_ffi = { version = "=153.3.0", path = "../mozjs-extracted-crates/unicode_bidi_ffi", optional = true }
mozjs_normalizer_glue = { version = "=153.3.0", path = "../mozjs-extracted-crates/normalizer_glue" }
mozjs_properties_glue = { version = "=153.3.0", path = "../mozjs-extracted-crates/properties_glue", optional = true }
mozjs_collator_glue = { version = "=153.3.0", path = "../mozjs-extracted-crates/collator_glue", optional = true }
mozjs_locale_glue = { version = "=153.3.0", path = "../mozjs-extracted-crates/locale_glue", optional = true }
# keep in sync with intl/icu_capi/Cargo.toml (upstream 153 pin: ICU4X 2.1.2)
icu_capi = { version = "=2.1.2", default-features = false, features = [
  "any_provider",
  "compiled_data",
  "segmenter",
  "calendar",
], optional = true }

libz-rs-sys = { version = "0.6", features = [
  "export-symbols",
], optional = true }
# SM depends on them and we provide them using cargo
libz-sys = { version = "1.1.19", default-features = false, features = [
  "libc",
  "stock-zlib",
], optional = true }

[build-dependencies]
bindgen = { version = "0.72.1", default-features = false, features = [
    "runtime",
] }
cc = "1"
walkdir = "2"
flate2 = "1"
tar = "0.4"
