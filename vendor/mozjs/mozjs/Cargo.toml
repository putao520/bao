[package]
# BAO PATCH (W0b publish fork): package renamed mozjs -> bao-mozjs for crates.io
# release; lib name stays `mozjs` so downstream `use mozjs::` keeps resolving.
# Dependents reach it via `package = "bao-mozjs"` rename.
# BAO PATCH (2026-09-21 build-face unification): the vendor/mozjs workspace
# root is absorbed into the bao workspace — every `*.workspace = true` below is
# an inlined literal, byte-identical to the former vendor workspace root.
name = "bao-mozjs"
description = "Rust bindings to the Mozilla SpiderMonkey JavaScript engine."
repository = "https://github.com/servo/mozjs/"
version = "0.24.0"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2021"

[lib]
# BAO PATCH (W0b): explicit lib name required after package rename to
# bao-mozjs — the sources carry `#![crate_name = "mozjs"]` and downstream code
# does `use mozjs::`; without this the default lib name would be `bao_mozjs`.
name = "mozjs"
doctest = false

[features]
default = ["jit", "libz-sys", "intl"]
debugmozjs = ["mozjs_sys/debugmozjs"]
profilemozjs = ["mozjs_sys/profilemozjs"]
jit = ['mozjs_sys/jit']
jitspew = ["mozjs_sys/jitspew"]
libz-sys = ["mozjs_sys/libz-sys"]
libz-rs = ["mozjs_sys/libz-rs"]
intl = ["mozjs_sys/intl"]
crown = ["mozjs_sys/crown"]


[dependencies]
encoding_rs = "0.8.35"
libc = "0.2"
log = "0.4"
# When doing non-version changes also update ../mozjs-sys/etc/sm-security-bump.py
# BAO PATCH (W0b): dep key stays `mozjs_sys` (code uses mozjs_sys::), package
# renamed to bao-mozjs-sys; version+path dual-declared so `cargo package`
# rewrites to the registry dep once bao-mozjs-sys is published.
mozjs_sys = { version = "=153.3.0-0", path = "../mozjs-sys", package = "bao-mozjs-sys" }
num-traits = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
criterion = { version = "0.6", default-features = false, features = [
    "html_reports",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.6"

[build-dependencies]
cc = "1"
bindgen = { version = "0.72.1", default-features = false, features = [
    "runtime",
] }


[[bench]]
name = "latin1_string_conversion"
harness = false
