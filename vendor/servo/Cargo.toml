# BAO PATCH (W3/#35): stylo family switched from git rev cc499a88 to the
# registry 0.20.0 lockstep set + in-tree bao-stylo fork. #29 spike evidence:
# 10/11 family crates are byte-identical between registry 0.20.0 and git
# cc499a88; only `stylo` drifted (SourceSizeList +Clone compile break,
# is_dark_color_scheme stub, PseudoElement repr, 2 test files) — hence the
# single-crate fork at vendor/stylo.
selectors = { version = "=0.40.0" }
serde = "1.0.228"
serde_bytes = "0.11"
serde_core = "1.0.226"
serde_json = "1.0"
