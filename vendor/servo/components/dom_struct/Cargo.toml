[package]
name = "bao-servo-dom-struct"
version = "0.5.2"
publish = true
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."
[dependencies]
prettyplease = {version = "0.2.32"}
proc-macro2 = {version = "1"}
quote = {version = "1"}
syn = {version = "2", default-features = false, features = ["clone-impls", "derive", "parsing", "printing", "proc-macro", "extra-traits", "full"]}

[lib]
path = "lib.rs"
proc-macro = true

name = "servo_dom_struct"
[lints.rust]
unexpected_cfgs = {level = "warn", check-cfg = ["cfg(crown)", "cfg(coverage)", "cfg(llvm_pgo)", "cfg(ohos_mock)"]}
[lints.clippy]
manual_string_new = "warn"
