[package]
name = "bao-servo-net"
version = "0.5.7"
authors.workspace = true
license.workspace = true
edition.workspace = true
publish = true
rust-version.workspace = true
repository.workspace = true
description.workspace = true
autotests = false # Inhibit lookup for tests/*.rs without [[test]] sections

[lib]
name = "net"
path = "lib.rs"
test = false
doctest = false

[features]
test-util = ["hyper-util/server-graceful", "dep:servo-default-resources", "net_traits/test-util"]
tracing = ["dep:tracing"]

[dependencies]
# Bao vendor deps: boringssl-backed stealth TLS connector (REQ-STL-001).
# bao_stealth: shared IANA→OpenSSL cipher/group/sigalg name mapping (single
# source of truth — local mapping copies in connector.rs are forbidden).
bao_boringssl_bridge = { path = "../../../../src/bao_boringssl_bridge", version = "0.1.0" }
bao_stealth = { path = "../../../../src/bao_stealth", version = "0.1.0" }
# Shared per-host DNS cache (Bao fusion: usockets + node:dns + the WS loader
# resolve through one cache). Low-tier, std-only surface.
bun_dns = { path = "../../../../src/dns", version = "0.1.0" }
bun_boringssl_sys = { path = "../../../../src/boringssl_sys", version = "0.1.0" }
# Bao fusion (U2 page-network unification): the page-network fetch driver on
# bun's HTTPThread (single epoll thread + stealth TLS) — the only path (the
# hyper escape hatch was removed with BAO_PAGE_NET_BUN).
bun_core = { path = "../../../../src/bun_core", version = "0.1.0" }
bun_http = { path = "../../../../src/http", version = "0.1.0" }
bun_threading = { path = "../../../../src/threading", version = "0.1.0" }
bun_url = { path = "../../../../src/url", version = "0.1.0" }
async-compression = { workspace = true, features = ["brotli", "gzip", "tokio", "zlib", "zstd"] }
async-recursion = { workspace = true }
async-tungstenite = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
content-security-policy = { workspace = true }
cookie = { workspace = true }
crossbeam-channel = { workspace = true }
data-url = { workspace = true }
devtools_traits = { workspace = true }
embedder_traits = { workspace = true }
fst = { workspace = true }
fonts = { workspace = true }
futures = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
headers = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "http2"] }
hyper-util = { workspace = true, features = ["http1"] }
hyper_serde = { workspace = true }
imsz = { workspace = true }
ipc-channel = { workspace = true }
itertools = { workspace = true }
log = { workspace = true }
malloc_size_of = { workspace = true }
malloc_size_of_derive = { workspace = true }
mime = { workspace = true }
mime_guess = { workspace = true }
net_traits = { workspace = true }
nom = { workspace = true }
paint_api = { workspace = true }
parking_lot = { workspace = true }
pixels = { workspace = true }
profile_traits = { workspace = true }
postcard = { workspace = true }
quick_cache = { workspace = true, features = ["ahash"] }
rand = { workspace = true }
regex = { workspace = true }
resvg = { workspace = true }
rustc-hash = { workspace = true }
rustls = { workspace = true, features = ["aws-lc-rs"] }
rustls-pki-types = { workspace = true }
rustls-platform-verifier = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
servo-base = { workspace = true }
servo-config = { workspace = true }
servo-default-resources = { workspace = true, optional = true }
servo-tracing = { workspace = true }
servo-url = { workspace = true }
servo_arc = { workspace = true }
sea-query = { workspace = true }
sea-query-rusqlite = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "sync"] }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true, features = ["codec", "io"] }
tower = { workspace = true }
tracing = { workspace = true, optional = true }
tungstenite = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
webpki-roots = { workspace = true }
webrender_api = { workspace = true }

[dev-dependencies]
# Link leg for the bun_bridge tests: the bun_http native seam (uws epoll
# loop, boringssl, lsquic archives) — same dedicated test-linking provider
# bun_http's own tests use (force_link called from the tests).
bao_native_stubs = { path = "../../../../src/bao_native_stubs", version = "0.1.0" }
bun_io = { path = "../../../../src/io", version = "0.1.0" }
flate2 = { workspace = true }
fst = { workspace = true }
hyper = { workspace = true, features = ["full"] }
hyper-util = { workspace = true, features = ["server-graceful"] }
# This must always be a path dependency, we don't want to add a dependency on a
# crates.io version of ourselves - we want to enable a feature of ourselves.
net = { package = "bao-servo-net", path = ".", version = "=0.5.7", features = ["test-util"] }
rustls = { workspace = true, features = ["aws-lc-rs"] }
servo-default-resources = { workspace = true }

[[test]]
name = "main"
path = "tests/main.rs"
