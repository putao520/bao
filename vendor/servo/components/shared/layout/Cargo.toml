[package]
name = "bao-servo-layout-api"
version = "0.5.19"
publish = true
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."
[lib]
name = "layout_api"
path = "lib.rs"

[dependencies]
accesskit = {version = "0.24.0", features = ["serde"]}
app_units = {version = "0.7"}
atomic_refcell = {version = "0.1.14"}
bitflags = {version = "2.11"}
embedder_traits = {package = "bao-servo-embedder-traits", path = "../../shared/embedder", version = ">=0.5.17, <0.6.0"}
euclid = {version = "0.22"}
fonts = {package = "bao-servo-fonts", path = "../../fonts", version = ">=0.5.19, <0.6.0"}
html5ever = {version = "0.40.1"}
libc = {version = "0.2"}
malloc_size_of = {package = "bao-servo-malloc-size-of", path = "../../malloc_size_of", version = ">=0.5.9, <0.6.0"}
malloc_size_of_derive = {version = "0.1"}
net_traits = {package = "bao-servo-net-traits", path = "../../shared/net", version = ">=0.5.15, <0.6.0"}
paint_api = {package = "bao-servo-paint-api", path = "../../shared/paint", version = ">=0.5.15, <0.6.0"}
parking_lot = {version = "0.12", features = ["serde"]}
pixels = {package = "bao-servo-pixels", path = "../../pixels", version = ">=0.5.17, <0.6.0"}
profile_traits = {package = "bao-servo-profile-traits", path = "../../shared/profile", version = ">=0.5.16, <0.6.0"}
rustc-hash = {version = "2.1.2"}
script_traits = {package = "bao-servo-script-traits", path = "../../shared/script", version = ">=0.5.14, <0.6.0"}
uuid = {version = "1.23.3", features = ["v4", "v5"]}
# BAO PATCH (e128): selectors resolves to the vendored servo/stylo monorepo fork
# (0cb50925b) by path — NOT via [patch.crates-io]: 0cb50925b has breaking API
# changes (Element gains a Copy bound) and lol_html depends on the registry
# crate, which must stay on the registry node.
selectors = {version = "=0.41.0", path = "../../../../selectors"}
serde = {version = "1.0.228"}
background_hang_monitor_api = {package = "bao-servo-background-hang-monitor-api", path = "../../shared/background_hang_monitor", version = ">=0.5.16, <0.6.0"}
servo-base = {package = "bao-servo-base", path = "../../shared/base", version = ">=0.5.17, <0.6.0"}
servo-url = {package = "bao-servo-url", path = "../../url", version = ">=0.5.9, <0.6.0"}
servo_arc = {version = "=0.5.0", features = ["servo"]}
style = {package = "bao-stylo", path = "../../../../stylo", version = ">=0.22.0, <0.23.0"}
stylo_traits = {version = "=0.22.0"}
webrender_api = {version = "0.70"}

[lints.rust]
unexpected_cfgs = {level = "warn", check-cfg = ["cfg(crown)", "cfg(coverage)", "cfg(llvm_pgo)", "cfg(ohos_mock)"]}
[lints.clippy]
manual_string_new = "warn"
