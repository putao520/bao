[package]
name = "bao-servo-script-traits"
version = "0.5.15"
publish = true
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."
[lib]
name = "script_traits"
path = "lib.rs"

[features]
bluetooth = ["servo-bluetooth-traits"]
webgl = []
webgpu = ["dep:webgpu_traits"]

[dependencies]
accesskit = {version = "0.24.0", features = ["serde"]}
bitflags = {version = "2.11"}
crossbeam-channel = {version = "0.5"}
devtools_traits = {package = "bao-servo-devtools-traits", path = "../../shared/devtools", version = ">=0.5.13, <0.6.0"}
embedder_traits = {package = "bao-servo-embedder-traits", path = "../../shared/embedder", version = ">=0.5.17, <0.6.0"}
# Bao patch: RouterProxy field in BaoPatches struct references ipc_channel
euclid = {version = "0.22"}
fonts_traits = {package = "bao-servo-fonts-traits", path = "../../shared/fonts", version = ">=0.5.17, <0.6.0"}
keyboard-types = {version = "0.8.3", features = ["serde", "webdriver"]}
malloc_size_of = {package = "bao-servo-malloc-size-of", path = "../../malloc_size_of", version = ">=0.5.9, <0.6.0"}
malloc_size_of_derive = {version = "0.1"}
media = {package = "bao-servo-media-thread", path = "../../media/media-thread", version = ">=0.5.16, <0.6.0"}
net_traits = {package = "bao-servo-net-traits", path = "../../shared/net", version = ">=0.5.15, <0.6.0"}
paint_api = {package = "bao-servo-paint-api", path = "../../shared/paint", version = ">=0.5.15, <0.6.0"}
pixels = {package = "bao-servo-pixels", path = "../../pixels", version = ">=0.5.17, <0.6.0"}
profile_traits = {package = "bao-servo-profile-traits", path = "../../shared/profile", version = ">=0.5.16, <0.6.0"}
rustc-hash = {version = "2.1.2"}
serde = {version = "1.0.228"}
servo-base = {package = "bao-servo-base", path = "../../shared/base", version = ">=0.5.17, <0.6.0"}
servo-bluetooth-traits = {package = "bao-servo-bluetooth-traits", path = "../../shared/bluetooth", version = ">=0.5.16, <0.6.0", optional = true}
servo-canvas-traits = {package = "bao-servo-canvas-traits", path = "../../shared/canvas", version = ">=0.5.16, <0.6.0"}
servo-config = {package = "bao-servo-config", path = "../../config", version = ">=0.5.12, <0.6.0"}
servo-constellation-traits = {package = "bao-servo-constellation-traits", path = "../../shared/constellation", version = ">=0.5.14, <0.6.0"}
servo-url = {package = "bao-servo-url", path = "../../url", version = ">=0.5.9, <0.6.0"}
storage_traits = {package = "bao-servo-storage-traits", path = "../../shared/storage", version = ">=0.5.16, <0.6.0"}
strum = {version = "0.28", features = ["derive"]}
stylo_atoms = {version = "=0.22.0"}
stylo_traits = {version = "=0.22.0"}
webgpu_traits = {package = "bao-servo-webgpu-traits", path = "../../shared/webgpu", version = ">=0.5.17, <0.6.0", optional = true}
webrender_api = {version = "0.70"}
webxr-api = {package = "bao-servo-webxr-api", path = "../../shared/webxr", version = ">=0.5.15, <0.6.0"}

[lints.rust]
unexpected_cfgs = {level = "warn", check-cfg = ["cfg(crown)", "cfg(coverage)", "cfg(llvm_pgo)", "cfg(ohos_mock)"]}
[lints.clippy]
manual_string_new = "warn"
