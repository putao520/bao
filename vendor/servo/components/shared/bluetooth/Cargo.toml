[package]
name = "bao-servo-bluetooth-traits"
version = "0.5.6"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
publish = true
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."

[lib]
name = "servo_bluetooth_traits"
path = "lib.rs"

[dependencies]
embedder_traits = {package = "bao-servo-embedder-traits", path = "../embedder", version = "=0.5.6"}
regex = {version = "1.12"}
serde = {version = "1.0.228"}
servo-base = {package = "bao-servo-base", path = "../base", version = "=0.5.6"}
