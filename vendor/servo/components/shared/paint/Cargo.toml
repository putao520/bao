[package]
name = "bao-servo-paint-api"
version = "0.5.6"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
publish = true
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."

[lib]
name = "paint_api"
path = "lib.rs"

[features]
no-wgl = ["surfman/sm-angle-default"]
tracing = ["dep:tracing"]

[dependencies]
bitflags = {version = "2.11"}
crossbeam-channel = {version = "0.5"}
dpi = {version = "0.1"}
embedder_traits = {package = "bao-servo-embedder-traits", path = "../embedder", version = "=0.5.6"}
euclid = {version = "0.22"}
gleam = {version = "0.15"}
glow = {version = "0.17.0"}
image = {version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "rayon", "webp"]}
ipc-channel = {package = "bao-ipc-channel", path = "../../../../ipc-channel", version = "0.22.0"}
log = {version = "0.4.32"}
malloc_size_of = {package = "bao-servo-malloc-size-of", path = "../../malloc_size_of", version = "=0.5.6"}
malloc_size_of_derive = {version = "0.1"}
parking_lot = {version = "0.12", features = ["serde"]}
profile_traits = {package = "bao-servo-profile-traits", path = "../profile", version = "=0.5.6"}
raw-window-handle = {version = "0.6"}
rustc-hash = {version = "2.1.2"}
serde = {version = "1.0.228"}
serde_bytes = {version = "0.11"}
servo-base = {package = "bao-servo-base", path = "../base", version = "=0.5.6"}
servo-geometry = {package = "bao-servo-geometry", path = "../../geometry", version = "=0.5.5"}
servo-tracing = {package = "bao-servo-tracing", path = "../../servo_tracing", version = "=0.5.2"}
servo-url = {package = "bao-servo-url", path = "../../url", version = "=0.5.6"}
smallvec = {version = "1.15", features = ["serde", "union"]}
strum = {version = "0.28", features = ["derive"]}
style = {package = "bao-stylo", path = "../../../../stylo", version = "=0.20.2"}
stylo_traits = {version = "=0.20.0"}
surfman = {version = "0.13.0", features = ["chains", "sm-x11"]}
tracing = {version = "0.1.44", optional = true}
webrender_api = {version = "0.70"}
