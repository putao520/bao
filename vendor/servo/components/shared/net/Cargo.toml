[package]
name = "bao-servo-net-traits"
version = "0.5.17"
publish = true
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."
[lib]
name = "net_traits"
path = "lib.rs"
test = false
doctest = false

[features]
test-util = []

[dependencies]
bytes = {version = "1.0", features = ["serde"]}
content-security-policy = {version = "0.9", features = ["serde"]}
cookie = {package = "cookie", version = "0.18"}
crossbeam-channel = {version = "0.5"}
data-url = {version = "0.3"}
embedder_traits = {package = "bao-servo-embedder-traits", path = "../../shared/embedder", version = ">=0.5.17, <0.6.0"}
headers = {version = "0.4"}
http = {version = "1.4"}
hyper-util = {version = "0.1", features = ["client-legacy", "client-proxy", "http2", "tokio"]}
hyper_serde = {package = "bao-servo-hyper-serde", path = "../../hyper_serde", version = ">=0.5.2, <0.6.0"}
ipc-channel = {package = "bao-ipc-channel", path = "../../../../ipc-channel", version = "0.22.0"}
log = {version = "0.4.32"}
malloc_size_of = {package = "bao-servo-malloc-size-of", path = "../../malloc_size_of", version = ">=0.5.9, <0.6.0"}
malloc_size_of_derive = {version = "0.1"}
mime = {version = "0.3.13"}
num-traits = {version = "0.2"}
paint_api = {package = "bao-servo-paint-api", path = "../../shared/paint", version = ">=0.5.15, <0.6.0"}
parking_lot = {version = "0.12", features = ["serde"]}
percent-encoding = {version = "2.3"}
pixels = {package = "bao-servo-pixels", path = "../../pixels", version = ">=0.5.17, <0.6.0"}
profile_traits = {package = "bao-servo-profile-traits", path = "../../shared/profile", version = ">=0.5.16, <0.6.0"}
rand = {version = "0.10"}
resvg = {version = "0.48.1"}
rustc-hash = {version = "2.1.2"}
rustls-pki-types = {version = "1.14"}
serde = {version = "1.0.228"}
serde_bytes = {version = "0.11"}
serde_with = {version = "3.13"}
servo-base = {package = "bao-servo-base", path = "../../shared/base", version = ">=0.5.17, <0.6.0"}
servo-config = {package = "bao-servo-config", path = "../../config", version = ">=0.5.12, <0.6.0"}
servo-url = {package = "bao-servo-url", path = "../../url", version = ">=0.5.9, <0.6.0"}
servo_arc = {version = "=0.5.0", features = ["servo"]}
sys-locale = {version = "0.3"}
rustls = {version = "0.23", default-features = false, features = ["logging", "std", "tls12"]}
tokio = {version = "1"}
url = {version = "2.5"}
uuid = {version = "1.23.3", features = ["v4", "v5"]}
webrender_api = {version = "0.70"}

[dev-dependencies]
servo-default-resources = {package = "bao-servo-default-resources", path = "../../default-resources", version = ">=0.5.17, <0.6.0"}

[lints.rust]
unexpected_cfgs = {level = "warn", check-cfg = ["cfg(crown)", "cfg(coverage)", "cfg(llvm_pgo)", "cfg(ohos_mock)"]}
[lints.clippy]
manual_string_new = "warn"
