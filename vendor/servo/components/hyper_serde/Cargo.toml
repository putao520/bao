[package]
name = "bao-servo-hyper-serde"
publish = true
version = "0.5.2"
documentation = "https://docs.rs/hyper_serde"
categories = ["encoding", "web-programming"]
keywords = ["serde", "serialization", "hyper", "cookie", "mime"]

authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."
[lib]
path = "lib.rs"
doctest = false
test = false

name = "servo_hyper_serde"
[dependencies]
cookie = {package = "cookie", version = "0.18"}
headers = {version = "0.4"}
http = {version = "1.4"}
hyper = {version = "1.10"}
mime = {version = "0.3.13"}
serde_bytes = {version = "0.11"}
serde_core = {version = "1.0.226"}

[dev-dependencies]
ipc-channel = {package = "bao-ipc-channel", path = "../../../ipc-channel", version = "0.22.0"}
serde = {version = "1.0.228"}
serde_json = {version = "1.0"}
serde_test = {version = "1.0"}

[lints.rust]
unexpected_cfgs = {level = "warn", check-cfg = ["cfg(crown)", "cfg(coverage)", "cfg(llvm_pgo)", "cfg(ohos_mock)"]}
[lints.clippy]
manual_string_new = "warn"
