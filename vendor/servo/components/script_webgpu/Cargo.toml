[package]
name = "bao-servo-script-webgpu"
version = "0.5.30"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
publish = true
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."
build = "build.rs"
[lib]
name = "script_webgpu"
path = "lib.rs"

[dependencies]
stylo_atoms = {version = "=0.22.0"}
arrayvec = {version = "0.7"}
euclid = {version = "0.22"}
servo-constellation-traits = {package = "bao-servo-constellation-traits", path = "../shared/constellation", version = ">=0.5.14, <0.6.0"}
deny_public_fields = {package = "bao-servo-deny-public-fields", path = "../deny_public_fields", version = ">=0.5.2, <0.6.0"}
dom_struct = {package = "bao-servo-dom-struct", path = "../dom_struct", version = ">=0.5.2, <0.6.0"}
indexmap = {version = "2.14.0", features = ["std"]}
js = {package = "bao-mozjs", path = "../../../mozjs/mozjs", version = "^0.24", default-features = false, features = ["intl", "libz-sys"]}
jstraceable_derive = {package = "bao-servo-jstraceable-derive", path = "../jstraceable_derive", version = ">=0.5.2, <0.6.0"}
log = {version = "0.4.32"}
script_bindings = {package = "bao-servo-script-bindings", path = "../script_bindings", version = ">=0.5.23, <0.6.0", features = ["webgpu"]}
malloc_size_of = {package = "bao-servo-malloc-size-of", path = "../malloc_size_of", version = ">=0.5.9, <0.6.0"}
malloc_size_of_derive = {version = "0.1"}
num-traits = {version = "0.2"}
pixels = {package = "bao-servo-pixels", path = "../pixels", version = ">=0.5.17, <0.6.0"}
serde_core = {version = "1.0.226"}
servo-url = {package = "bao-servo-url", path = "../url", version = ">=0.5.9, <0.6.0"}
servo-base = {package = "bao-servo-base", path = "../shared/base", version = ">=0.5.17, <0.6.0"}
trait-set = {version = "0.5"}
webgpu_traits = {package = "bao-servo-webgpu-traits", path = "../shared/webgpu", version = ">=0.5.17, <0.6.0"}
[lints.clippy]
manual_string_new = "warn"
[lints.rust]
unexpected_cfgs = {level = "warn", check-cfg = ["cfg(crown)", "cfg(coverage)", "cfg(llvm_pgo)", "cfg(ohos_mock)"]}
