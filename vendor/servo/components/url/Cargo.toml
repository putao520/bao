[package]
# BAO PATCH (W0b fork scaffold): package renamed servo-url -> bao-servo-url as
# the mechanism sample for the W3 56-crate servo fork batch. lib name stays
# `servo_url`. version/publish pinned explicitly (servo workspace.package
# carries version 0.5.0 and publish=false; a publishable fork crate must
# override publish).
name = "bao-servo-url"
version = "0.5.1"
authors.workspace = true
license.workspace = true
edition.workspace = true
publish = true
rust-version.workspace = true
repository.workspace = true
description.workspace = true

[lib]
name = "servo_url"
path = "lib.rs"
test = false
doctest = false

[dependencies]
encoding_rs = { workspace = true }
malloc_size_of = { workspace = true }
malloc_size_of_derive = { workspace = true }
serde = { workspace = true, features = ["derive"] }
servo_arc = { workspace = true }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["serde"] }
