[package]
# BAO PATCH (W0b fork scaffold): package renamed servo-url -> bao-servo-url as
# the mechanism sample for the W3 56-crate servo fork batch. lib name stays
# `servo_url`. version/publish pinned explicitly (servo workspace.package
# carries version 0.5.0 and publish=false; a publishable fork crate must
# override publish).
name = "bao-servo-url"
version = "0.5.6"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
publish = true
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."

[lib]
name = "servo_url"
path = "lib.rs"
test = false
doctest = false

[dependencies]
encoding_rs = {version = "0.8", features = ["serde"]}
malloc_size_of = {package = "bao-servo-malloc-size-of", path = "../malloc_size_of", version = "=0.5.6"}
malloc_size_of_derive = {version = "0.1"}
serde = {version = "1.0.228", features = ["derive"]}
servo_arc = {version = "=0.4.3"}
url = {version = "2.5", features = ["serde"]}
uuid = {version = "1.23.3", features = ["v4", "v5", "serde"]}
