[package]
name = "bao-servo-allocator"
version = "0.5.5"
publish = true
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."
[lib]
path = "lib.rs"

name = "servo_allocator"
[features]
# BAO PATCH (embed): the custom allocator is fully opt-in — the default build
# has NO custom allocator at all: no `#[global_allocator]` installed and no
# tikv-jemalloc deps in the graph (System allocator + System introspection).
# Library embeds (frog tools path-dep on package `bao`) own the process
# allocator; dual `#[global_allocator]` fails link.
# `install-global-allocator` is the single knob (implies use-jemalloc —
# installing the System allocator is meaningless): install jemalloc as the
# process allocator with the matching introspection platform. The standalone
# bao binary enables it (upstream servoshell parity).
allocation-tracking = ["backtrace", "dep:rustc-hash", "log", "install-global-allocator"]
use-jemalloc = ["dep:tikv-jemalloc-sys", "dep:tikv-jemallocator"]

default = []
install-global-allocator = ["use-jemalloc"]
[dependencies]
backtrace = {version = "0.3", optional = true}
log = {version = "0.4.32", optional = true}
rustc-hash = {version = "2.1.2", optional = true}

[target.'cfg(not(any(windows, target_env = "ohos")))'.dependencies]
libc = {version = "0.2"}
tikv-jemalloc-sys = {version = "0.6.1", features = ["stats"], optional = true}
tikv-jemallocator = {version = "0.6.1", optional = true}

[target.'cfg(windows)'.dependencies]
windows-sys = {version = "0.61", features = ["Win32_System_Memory"]}

[target.'cfg(target_env = "ohos")'.dependencies]
libc = {version = "0.2"}

[lints.rust]
unexpected_cfgs = {level = "warn", check-cfg = ["cfg(crown)", "cfg(coverage)", "cfg(llvm_pgo)", "cfg(ohos_mock)"]}
[lints.clippy]
manual_string_new = "warn"
