[package]
name = "bao-servo-pixels"
version = "0.5.6"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
publish = true
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."

[lib]
name = "pixels"
path = "lib.rs"

[dependencies]
euclid = {version = "0.22"}
image = {version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "rayon", "webp"]}
log = {version = "0.4.32"}
malloc_size_of = {package = "bao-servo-malloc-size-of", path = "../malloc_size_of", version = "=0.5.6"}
malloc_size_of_derive = {version = "0.1"}
serde = {version = "1.0.228", features = ["derive"]}
servo-base = {package = "bao-servo-base", path = "../shared/base", version = "=0.5.6"}
webrender_api = {version = "0.70"}

[dev-dependencies]
criterion = {version = "0.8", features = ["html_reports"]}

[[bench]]
name = "unmultiply_inplace"
path = "benches/unmultiply_inplace.rs"
harness = false
