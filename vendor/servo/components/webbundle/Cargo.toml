[package]
# BAO PATCH (REQ-BRW-051): new WICG WebBundle component. Upstream servo has no
# web-bundle support (neither the parser nor the `<script type=webbundle>`
# subresource-loading API), so this component is a fork-only addition. Package
# follows the `bao-servo-*` fork naming and the 0.5.x family version range that
# the vendor components use.
name = "bao-servo-webbundle"
version = "0.5.0"
publish = true
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "WICG WebBundle (application/webbundle, draft-2) parser for web bundle subresource loading."

[lib]
name = "webbundle"
path = "lib.rs"

[dependencies]
ciborium = "0.2"
http = { version = "1.4" }
log = { version = "0.4.32" }
servo_url = { package = "bao-servo-url", path = "../url", version = ">=0.5.12, <0.6.0" }
