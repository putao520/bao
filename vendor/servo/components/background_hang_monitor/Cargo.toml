[package]
name = "bao-servo-background-hang-monitor"
version = "0.5.6"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
publish = true
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."

[lib]
name = "servo_background_hang_monitor"
path = "lib.rs"
test = false
doctest = false

[dependencies]
backtrace = {version = "0.3"}
crossbeam-channel = {version = "0.5"}
libc = {version = "0.2"}
log = {version = "0.4.32"}
rustc-demangle = {version = "0.1", optional = true}
rustc-hash = {version = "2.1.2"}
serde_json = {version = "1.0"}
background_hang_monitor_api = {package = "bao-servo-background-hang-monitor-api", path = "../shared/background_hang_monitor", version = "=0.5.6"}
servo-base = {package = "bao-servo-base", path = "../shared/base", version = "=0.5.6"}

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = {version = "0.6", optional = true}

[target.'cfg(all(target_os = "linux", not(any(target_arch = "arm", target_arch = "aarch64", target_env = "ohos", target_env = "musl"))))'.dependencies]
nix = {version = "0.30", features = ["signal"], optional = true}

[target.'cfg(target_os = "android")'.dependencies]
nix = {version = "0.30", features = ["signal"], optional = true}

[features]
sampler = ["mach2", "nix", "rustc-demangle"]
