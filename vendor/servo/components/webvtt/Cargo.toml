[package]
name = "bao-servo-webvtt"
version = "0.5.5"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
publish = true
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."


[lib]
name = "servo_webvtt"
[features]
test-util = []

[dependencies]
html5ever = {version = "0.40.1"}
markup5ever = {version = "0.40"}
regex = {version = "1.12"}

[dev-dependencies]
# BAO patch (fork-maintained, 2026-09-27): the upstream self-referential
# dev-dependency (`bao-servo-webvtt = { path = ".", ... }`) is removed — it
# cannot be resolved for a non-member path dependency in this fork's single
# cargo universe; `shared_test_setup` is un-gated in lib.rs instead.

