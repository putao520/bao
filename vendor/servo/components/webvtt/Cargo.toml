[package]
name = "bao-servo-webvtt"
version = "0.5.3"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
publish = true
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."


[lib]
name = "servo_webvtt"
[features]
test-util = []

[dependencies]
html5ever = {version = "0.39"}
markup5ever = {version = "0.39"}
regex = {version = "1.12"}

[dev-dependencies]
bao-servo-webvtt = { path = ".", version = "=0.5.3", features = ["test-util"] }
