[package]
name = "bao-servo-paint"
version = "0.5.3"
authors.workspace = true
license.workspace = true
edition.workspace = true
publish = true
rust-version.workspace = true
repository.workspace = true
description.workspace = true

[lib]
name = "paint"
path = "lib.rs"

[features]
# BAO carry-patch: webgl default-on. Bao (bao_browser) depends on the servo
# crate with default-features = false and only enables baked-in-resources, so
# nothing in the bao graph would enable servo-paint/webgl after upstream
# optional-ization (522fa371e). Keep WebGL compiled in until bao-side wiring
# switches to servo/webgl explicitly.
default = ["webgl"]
tracing = ["dep:tracing"]
webgl = ["dep:webgl"]
webgpu = ["dep:webgpu"]
webxr = ["webgl", "dep:webxr", "dep:webxr-api"]

[lints.clippy]
unwrap_used = "deny"
panic = "deny"

[dependencies]
bitflags = { workspace = true }
crossbeam-channel = { workspace = true }
dpi = { workspace = true }
embedder_traits = { workspace = true }
euclid = { workspace = true }
gleam = { workspace = true }
image = { workspace = true }
log = { workspace = true }
malloc_size_of = { workspace = true }
media = { workspace = true }
paint_api = { workspace = true }
profile_traits = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
servo-allocator = { workspace = true }
servo-base = { workspace = true }
servo-canvas-traits = { workspace = true }
servo-config = { workspace = true }
servo-constellation-traits = { workspace = true }
servo-geometry = { workspace = true }
servo-tracing = { workspace = true }
smallvec = { workspace = true }
stylo_traits = { workspace = true }
surfman = { workspace = true }
timers = { workspace = true }
tracing = { workspace = true, optional = true }
webgl = { workspace = true, optional = true }
webgpu = { workspace = true, optional = true }
webrender = { workspace = true }
webrender_api = { workspace = true }
webxr = { workspace = true, optional = true }
webxr-api = { workspace = true, optional = true }
wr_malloc_size_of = { workspace = true }

[dev-dependencies]
surfman = { workspace = true }
