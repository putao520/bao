[package]
name = "bao-servo-config"
version = "0.5.13"
publish = true
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."
[lib]
name = "servo_config"
path = "lib.rs"

[dependencies]
num_enum = {version = "0.7"}
serde = {version = "1.0.228", features = ["derive"]}
serde_json = {version = "1.0"}
servo-config-macro = {package = "bao-servo-config-macro", path = "../config/macro", version = ">=0.5.4, <0.6.0"}
strum = {version = "0.28", features = ["derive"]}
stylo_static_prefs = {version = "=0.22.0"}

[lints.rust]
unexpected_cfgs = {level = "warn", check-cfg = ["cfg(crown)", "cfg(coverage)", "cfg(llvm_pgo)", "cfg(ohos_mock)"]}
[lints.clippy]
manual_string_new = "warn"
