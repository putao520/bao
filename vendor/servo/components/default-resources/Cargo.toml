[package]
name = "bao-servo-default-resources"
version = "0.5.18"
publish = true
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."
[lib]
path = "lib.rs"

name = "servo_default_resources"
[dependencies]
embedder_traits = {package = "bao-servo-embedder-traits", path = "../shared/embedder", version = ">=0.5.17, <0.6.0"}

[lints.rust]
unexpected_cfgs = {level = "warn", check-cfg = ["cfg(crown)", "cfg(coverage)", "cfg(llvm_pgo)", "cfg(ohos_mock)"]}
[lints.clippy]
manual_string_new = "warn"
