[package]
name = "bao-servo-media-webrtc"
version = "0.5.5"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
publish = true
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."

[lib]
name = "servo_media_webrtc"
path = "lib.rs"

[dependencies]
log = {version = "0.4.32"}
servo-media-streams = {package = "bao-servo-media-streams", path = "../streams", version = "=0.5.5"}
uuid = {version = "1.23.3", features = ["v4", "v5"]}
