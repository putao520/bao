[package]
name = "bao-servo-media-audio"
version = "0.5.6"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
publish = true
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."

[lib]
name = "servo_media_audio"
path = "lib.rs"

[dependencies]
byte-slice-cast = {version = "1.2.3"}
euclid = {version = "0.22"}
log = {version = "0.4.32"}
malloc_size_of = {package = "bao-servo-malloc-size-of", path = "../../malloc_size_of", version = "=0.5.6"}
malloc_size_of_derive = {version = "0.1"}
num-complex = {version = "0.4.6"}
num-traits = {version = "0.2"}
petgraph = {version = "0.8.3", features = ["stable_graph"]}
rustc-hash = {version = "2.1.2"}
serde = {version = "1.0.228", features = ["derive"]}
servo-base = {package = "bao-servo-base", path = "../../shared/base", version = "=0.5.6"}
servo-media-derive = {package = "bao-servo-media-derive", path = "../servo-media-derive", version = "=0.5.2"}
servo-media-player = {package = "bao-servo-media-player", path = "../player", version = "=0.5.6"}
servo-media-streams = {package = "bao-servo-media-streams", path = "../streams", version = "=0.5.5"}
servo-media-traits = {package = "bao-servo-media-traits", path = "../traits", version = "=0.5.5"}
smallvec = {version = "1.15", features = ["serde", "union"]}
speexdsp-resampler = {version = "0.1.0"}
