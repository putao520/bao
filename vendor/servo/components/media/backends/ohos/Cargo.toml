[package]
name = "bao-servo-media-ohos"
version = "0.5.6"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
publish = true
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."

[lib]
name = "servo_media_ohos"
path = "lib.rs"

[dependencies]
crossbeam-channel = {version = "0.5"}
libc = {version = "0.2"}
log = {version = "0.4.32"}
mime = {version = "0.3.13"}
ohos-media-sys = {version = "0.1.1", features = ["api-21"]}
ohos-sys-opaque-types = {version = "0.1.7"}
ohos-window-sys = {version = "0.1.7", features = ["api-13"]}
servo-base = {package = "bao-servo-base", path = "../../../shared/base", version = "=0.5.6"}
servo-media = {package = "bao-servo-media", path = "../../servo-media", version = "=0.5.6"}
servo-media-audio = {package = "bao-servo-media-audio", path = "../../audio", version = "=0.5.6"}
servo-media-player = {package = "bao-servo-media-player", path = "../../player", version = "=0.5.6"}
servo-media-streams = {package = "bao-servo-media-streams", path = "../../streams", version = "=0.5.5"}
servo-media-traits = {package = "bao-servo-media-traits", path = "../../traits", version = "=0.5.5"}
servo-media-webrtc = {package = "bao-servo-media-webrtc", path = "../../webrtc", version = "=0.5.5"}
yuv = {version = "0.8.14", features = ["rayon"]}

[build-dependencies]
serde_json = {version = "1.0"}
