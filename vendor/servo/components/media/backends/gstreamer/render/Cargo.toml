[package]
name = "bao-servo-media-gstreamer-render"
version = "0.5.6"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
publish = true
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."

[lib]
name = "servo_media_gstreamer_render"
path = "lib.rs"

[dependencies]
gstreamer = {version = "0.25", features = ["v1_18"]}
servo-media-player = {package = "bao-servo-media-player", path = "../../../player", version = "=0.5.6"}
