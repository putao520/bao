[package]
name = "servo-media-examples"
version = "0.5.2"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
publish = false
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."

[dependencies]
euclid = {version = "0.22"}
rand = {version = "0.10"}
serde = {version = "1.0.228"}
servo = {package = "bao-servo", path = "../../servo", version = "=0.5.15", default-features = true}
servo-media = {package = "bao-servo-media", path = "../servo-media", version = "=0.5.6"}
servo-media-auto = {package = "bao-servo-media-auto", path = "../backends/auto", version = "=0.5.5"}
servo-media-dummy = {package = "bao-servo-media-dummy", path = "../backends/dummy", version = "=0.5.6"}
