[package]
name = "bao-servo-layout"
version = "0.5.14"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
publish = true
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."

[lib]
name = "layout"
path = "lib.rs"
test = true
doctest = false

[features]
tracing = ["dep:tracing"]

[dependencies]
accesskit = {version = "0.24.0", features = ["serde"]}
app_units = {version = "0.7"}
arrayvec = {version = "0.7"}
atomic_refcell = {version = "0.1.14"}
bitflags = {version = "2.11"}
data-url = {version = "0.3"}
embedder_traits = {package = "bao-servo-embedder-traits", path = "../shared/embedder", version = "=0.5.6"}
euclid = {version = "0.22"}
fonts = {package = "bao-servo-fonts", path = "../fonts", version = "=0.5.9"}
fonts_traits = {package = "bao-servo-fonts-traits", path = "../shared/fonts", version = "=0.5.7"}
icu_locid = {version = "1.5.0"}
icu_properties = {version = "1.5.0", features = ["compiled_data"]}
icu_segmenter = {version = "1.5.0"}
itertools = {version = "0.15"}
kurbo = {version = "0.13.1", features = ["euclid"]}
layout_api = {package = "bao-servo-layout-api", path = "../shared/layout", version = "=0.5.10"}
log = {version = "0.4.32"}
malloc_size_of = {package = "bao-servo-malloc-size-of", path = "../malloc_size_of", version = "=0.5.6"}
malloc_size_of_derive = {version = "0.1"}
net_traits = {package = "bao-servo-net-traits", path = "../shared/net", version = "=0.5.7"}
num-derive = {version = "0.4.2"}
num-traits = {version = "0.2"}
once_cell = {version = "1.21.4"}
paint_api = {package = "bao-servo-paint-api", path = "../shared/paint", version = "=0.5.6"}
parking_lot = {version = "0.12", features = ["serde"]}
phf = {version = "0.13"}
pixels = {package = "bao-servo-pixels", path = "../pixels", version = "=0.5.6"}
profile_traits = {package = "bao-servo-profile-traits", path = "../shared/profile", version = "=0.5.6"}
rayon = {version = "1"}
rustc-hash = {version = "2.1.2"}
script = {package = "bao-servo-script", path = "../script", version = "=0.5.16"}
script_traits = {package = "bao-servo-script-traits", path = "../shared/script", version = "=0.5.8"}
selectors = {version = "=0.40.0"}
serde = {version = "1.0.228"}
servo-base = {package = "bao-servo-base", path = "../shared/base", version = "=0.5.6"}
servo-config = {package = "bao-servo-config", path = "../config", version = "=0.5.2"}
servo-geometry = {package = "bao-servo-geometry", path = "../geometry", version = "=0.5.5"}
servo-tracing = {package = "bao-servo-tracing", path = "../servo_tracing", version = "=0.5.2"}
servo-url = {package = "bao-servo-url", path = "../url", version = "=0.5.6"}
servo_arc = {version = "=0.4.3"}
smallvec = {version = "1.15", features = ["serde", "union"]}
strum = {version = "0.28", features = ["derive"]}
style = {package = "bao-stylo", path = "../../../stylo", version = "=0.20.2"}
stylo_atoms = {version = "=0.20.0"}
stylo_traits = {version = "=0.20.0"}
taffy = {version = "0.13.0", default-features = false, features = ["calc", "detailed_layout_info", "grid", "std"]}
tracing = {version = "0.1.44", optional = true}
unicode-bidi = {version = "0.3.18"}
unicode-script = {version = "0.5"}
unicode_categories = {version = "0.1.1"}
url = {version = "2.5"}
uuid = {version = "1.23.3", features = ["v4", "v5"]}
web_atoms = {version = "0.2.6"}
webrender_api = {version = "0.70"}

[dev-dependencies]
quickcheck = {version = "1"}
