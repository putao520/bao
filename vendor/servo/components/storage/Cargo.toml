[package]
name = "bao-servo-storage"
version = "0.5.17"
publish = true
autotests = false # Inhibit lookup for tests/*.rs without [[test]] sections

authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."
[lib]
name = "storage"
path = "lib.rs"

[dependencies]
libc = {version = "0.2"}
log = {version = "0.4.32"}
malloc_size_of = {package = "bao-servo-malloc-size-of", path = "../malloc_size_of", version = ">=0.5.9, <0.6.0"}
malloc_size_of_derive = {version = "0.1"}
net_traits = {package = "bao-servo-net-traits", path = "../shared/net", version = ">=0.5.15, <0.6.0"}
postcard = {version = "1.1.3", default-features = false, features = ["use-std"]}
profile_traits = {package = "bao-servo-profile-traits", path = "../shared/profile", version = ">=0.5.16, <0.6.0"}
rusqlite = {version = "0.38", features = ["bundled"]}
rustc-hash = {version = "2.1.2"}
sea-query = {version = "1.0.1", default-features = false, features = ["backend-sqlite", "derive"]}
sea-query-rusqlite = {version = "0.8.0"}
serde = {version = "1.0.228"}
servo-base = {package = "bao-servo-base", path = "../shared/base", version = ">=0.5.17, <0.6.0"}
servo-config = {package = "bao-servo-config", path = "../config", version = ">=0.5.12, <0.6.0"}
servo-url = {package = "bao-servo-url", path = "../url", version = ">=0.5.9, <0.6.0"}
storage_traits = {package = "bao-servo-storage-traits", path = "../shared/storage", version = ">=0.5.16, <0.6.0"}
tempfile = {version = "3"}
uuid = {version = "1.23.3", features = ["v4", "v5"]}

[dev-dependencies]
profile = {package = "bao-servo-profile", path = "../profile", version = ">=0.5.18, <0.6.0"}
servo-default-resources = {package = "bao-servo-default-resources", path = "../default-resources", version = ">=0.5.17, <0.6.0"}
url = {version = "2.5"}

[lints.rust]
unexpected_cfgs = {level = "warn", check-cfg = ["cfg(crown)", "cfg(coverage)", "cfg(llvm_pgo)", "cfg(ohos_mock)"]}
[lints.clippy]
manual_string_new = "warn"
