[package]
name = "bao-servo-webxr"
version = "0.5.6"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
publish = true
rust-version = "1.88.0"
keywords = ["ar", "headset", "openxr", "vr", "webxr"]
repository = "https://github.com/servo/servo"
description = '''A safe Rust API that provides a way to interact with
virtual reality and augmented reality devices and integration with OpenXR.
The API is inspired by the WebXR Device API (https://www.w3.org/TR/webxr/)
but adapted to Rust design patterns.'''

[lib]
name = "servo_webxr"
path = "lib.rs"

[features]
default = ["x11"]
angle = ["surfman/sm-angle"]
glwindow = []
headless = []
openxr-api = ["angle", "openxr", "winapi", "wio", "surfman/sm-angle-default"]
x11 = ["surfman/sm-x11"]

[dependencies]
crossbeam-channel = {version = "0.5"}
euclid = {version = "0.22"}
glow = {version = "0.17.0"}
log = {version = "0.4.32"}
openxr = {version = "0.21", optional = true}
profile_traits = {package = "bao-servo-profile-traits", path = "../shared/profile", version = "=0.5.6"}
raw-window-handle = {version = "0.6"}
servo-base = {package = "bao-servo-base", path = "../shared/base", version = "=0.5.6"}
surfman = {version = "0.13.0", features = ["chains", "sm-raw-window-handle-06"]}
webxr-api = {package = "bao-servo-webxr-api", path = "../shared/webxr", version = "=0.5.6"}

[target.'cfg(target_os = "windows")'.dependencies]
winapi = {version = "0.3", features = ["d3d11", "dxgi", "winerror"], optional = true}
wio = {version = "0.2", optional = true}
