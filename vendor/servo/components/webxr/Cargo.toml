[package]
name = "bao-servo-webxr"
version = "0.5.17"
publish = true
keywords = ["ar", "headset", "openxr", "vr", "webxr"]
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."
[lib]
path = "lib.rs"

name = "servo_webxr"
[features]
default = ["x11"]
angle = ["surfman/sm-angle"]
glwindow = []
headless = []
openxr-api = ["angle", "openxr", "winapi", "wio", "surfman/sm-angle-default"]
x11 = ["surfman/sm-x11"]

[dependencies]
crossbeam-channel = {version = "0.5"}
euclid = {version = "0.22"}
glow = {version = "0.17.0"}
log = {version = "0.4.32"}
openxr = {version = "0.21", optional = true}
profile_traits = {package = "bao-servo-profile-traits", path = "../shared/profile", version = ">=0.5.16, <0.6.0"}
raw-window-handle = {version = "0.6"}
servo-base = {package = "bao-servo-base", path = "../shared/base", version = ">=0.5.17, <0.6.0"}
surfman = {version = "0.14.0"}
webxr-api = {package = "bao-servo-webxr-api", path = "../shared/webxr", version = ">=0.5.15, <0.6.0"}

[target.'cfg(target_os = "windows")'.dependencies]
winapi = {version = "0.3", features = ["d3d11", "dxgi", "winerror"], optional = true}
wio = {version = "0.2", optional = true}

[lints.rust]
unexpected_cfgs = {level = "warn", check-cfg = ["cfg(crown)", "cfg(coverage)", "cfg(llvm_pgo)", "cfg(ohos_mock)"]}
[lints.clippy]
manual_string_new = "warn"
