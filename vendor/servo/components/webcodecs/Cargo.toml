[package]
name = "bao-servo-webcodecs"
version = "0.5.0"
publish = true
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."
# BAO patch (fork-maintained, 2026-10-20; Wave B audio legs 2026-10-21):
# WebCodecs codec plane — codec string parsing (RFC 6381), Video/Audio
# decoder config validation + lifecycle, a GStreamer video decode backend, a
# GStreamer audio decode backend (opus/AAC, Wave B), a GStreamer audio encode
# backend (opusenc/avenc_aac, Wave B), and an image-crate ImageDecoder backend
# (REQ-BRW-051). Upstream servo has no webcodecs component; this is a
# fork-native component. Upstream-absorb obligation: the whole `src/gst_audio_*`
# surface is fork-native (no upstream counterpart), so an upstream sync keeps
# it as-is and only re-validates the GStreamer crate versions pinned below.
# See CLAUDE.md BAO patch list.
[features]
default = []
# GStreamer video decode + audio decode/encode backends (Wave B added the audio
# legs, REQ-BRW-051). Default-on on Linux (bao product); disabled on Windows
# (bao_browser does not enable servo media-gstreamer, so there is no runtime
# plugin guarantee — see CLAUDE.md Windows 交叉编译准入律). `gstreamer-audio`
# supplies `AudioInfo`/`AudioCapsBuilder`/`AudioFormat` for caps construction
# and sample geometry; it is already in the workspace lock at 0.25.3 through
# `bao-servo-media-gstreamer`, so this feature adds no new crate versions.
media-gstreamer = [
    "dep:gstreamer",
    "dep:gstreamer-app",
    "dep:gstreamer-video",
    "dep:gstreamer-audio",
]

[dependencies]
# Lock-proven (image 0.25.10 / gif 0.14.2): pure-Rust PNG/GIF/JPEG lossy+lossless/
# animated/WebP image decode + EXIF orientation (REQ-BRW-051 C2 image plane).
image = {version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp", "bmp", "ico"]}
gif = {version = "0.14.2"}
log = {version = "0.4"}
serde = {version = "1", features = ["derive"]}
gstreamer = {package = "gstreamer", version = "0.25.3", optional = true}
gstreamer-app = {version = "0.25.2", optional = true}
gstreamer-video = {version = "0.25.3", optional = true}
gstreamer-audio = {version = "0.25.3", optional = true}

[lints.rust]
unexpected_cfgs = {level = "warn", check-cfg = ["cfg(crown)", "cfg(coverage)", "cfg(llvm_pgo)", "cfg(ohos_mock)"]}
[lints.clippy]
manual_string_new = "warn"
