[package]
name = "bao-servo-script-bindings"
build = "build.rs"
version = "0.5.23"
publish = true
links = "script_bindings_crate"

authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."
[lib]
name = "script_bindings"
path = "lib.rs"

[dependencies]
atomic_refcell = {version = "0.1.14"}
bitflags = {version = "2.11"}
crossbeam-channel = {version = "0.5"}
deny_public_fields = {package = "bao-servo-deny-public-fields", path = "../deny_public_fields", version = ">=0.5.2, <0.6.0"}
dom_struct = {package = "bao-servo-dom-struct", path = "../dom_struct", version = ">=0.5.2, <0.6.0"}
encoding_rs = {version = "0.8", features = ["serde"]}
html5ever = {version = "0.40.1"}
indexmap = {version = "2.14.0", features = ["std"]}
js = {package = "bao-mozjs", path = "../../../mozjs/mozjs", version = "^0.24", default-features = false, features = ["intl", "libz-sys"]}
jstraceable_derive = {package = "bao-servo-jstraceable-derive", path = "../jstraceable_derive", version = ">=0.5.2, <0.6.0"}
keyboard-types = {version = "0.8.3", features = ["serde", "webdriver"]}
libc = {version = "0.2"}
log = {version = "0.4.32"}
malloc_size_of = {package = "bao-servo-malloc-size-of", path = "../malloc_size_of", version = ">=0.5.9, <0.6.0"}
malloc_size_of_derive = {version = "0.1"}
num-traits = {version = "0.2"}
parking_lot = {version = "0.12", features = ["serde"]}
phf = {version = "0.14", features = ["macros"]}
profile_traits = {package = "bao-servo-profile-traits", path = "../shared/profile", version = ">=0.5.16, <0.6.0"}
regex = {version = "1.12"}
rustc-hash = {version = "2.1.2"}
serde = {version = "1.0.228"}
servo-base = {package = "bao-servo-base", path = "../shared/base", version = ">=0.5.17, <0.6.0"}
servo-config = {package = "bao-servo-config", path = "../config", version = ">=0.5.12, <0.6.0"}
servo-constellation-traits = {package = "bao-servo-constellation-traits", path = "../shared/constellation", version = ">=0.5.14, <0.6.0"}
servo-url = {package = "bao-servo-url", path = "../url", version = ">=0.5.9, <0.6.0"}
servo_arc = {version = "=0.5.0", features = ["servo"]}
smallvec = {version = "1.15", features = ["serde", "union"]}
strum = {version = "0.28", features = ["derive"]}
style = {package = "bao-stylo", path = "../../../stylo", version = ">=0.22.0, <0.23.0"}
stylo_atoms = {version = "=0.22.0"}
tendril = {version = "0.5", features = ["encoding_rs"]}
tracing = {version = "0.1.44", optional = true}
webxr-api = {package = "bao-servo-webxr-api", path = "../shared/webxr", version = ">=0.5.15, <0.6.0", optional = true}
xml5ever = {version = "0.40"}
zeroize = {version = "1.8", features = ["zeroize_derive"]}

[build-dependencies]
phf_codegen = {version = "0.14"}
phf_shared = {version = "0.14"}
serde_json = {version = "1.0"}

[dev-dependencies]
criterion = {version = "0.8"}

[features]
bluetooth = []
gamepad = []
testbinding = []
tracing = ["dep:tracing"]
webcrypto = []
webgpu = []
webgl = []
webxr = ["gamepad", "webgl", "webxr-api"]

[lints.rust]
unexpected_cfgs = {level = "warn", check-cfg = ["cfg(crown)", "cfg(coverage)", "cfg(llvm_pgo)", "cfg(ohos_mock)"]}
[lints.clippy]
manual_string_new = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(crown)'] }
unsafe_op_in_unsafe_fn = { level = "allow" }
