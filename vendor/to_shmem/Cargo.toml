# BAO PATCH (e128, 2026-10-07, REQ-BRW-002 vendor convergence to 2026-10-05
# upstream boundary): vendored from the servo/stylo monorepo @ 0cb50925b
# (the rev upstream servo pins in commit 614cd411f "Upgrade Stylo to
# 2026-10-01"; crates.io still tops at 0.22.0/0.41.0/0.5.0, so the git
# snapshot is vendored per user ruling 2026-10-07 — W3 "fork 1 pkg only"
# superseded for this wave, noted in the absorption ledger).
# Workspace inheritance (version.workspace / x = { workspace = true }) is
# inlined as path+version literals — single compile universe, no vendor
# sub-workspace (single-compile-universe ruling).
# Upstream sync: re-copy from the monorepo rev servo pins, redo inlining.
[package]
name = "to_shmem"
version = "0.6.0"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
repository = "https://github.com/servo/stylo"
edition = "2024"
description = "Trait to write to a contiguous chunk of shared memory"

[lib]
name = "to_shmem"
path = "lib.rs"

[features]
servo = ["cssparser/serde", "cssparser", "servo_arc", "smallbitvec", "smallvec", "string_cache", "thin-vec"]
gecko = ["thin-vec/gecko-ffi", "cssparser", "servo_arc", "smallbitvec", "smallvec", "thin-vec"]

cssparser = ["dep:cssparser"]
servo_arc = ["dep:servo_arc"]
smallbitvec = ["dep:smallbitvec"]
smallvec = ["dep:smallvec"]
string_cache = ["dep:string_cache"]
thin-vec = ["dep:thin-vec"]

[dependencies]
cssparser = { version = "0.38", optional = true }
hashbrown = "0.17"
servo_arc = { version = "0.5.0", path = "../servo_arc", optional = true }
smallbitvec = { version = "2.3.0", optional = true }
smallvec = { version = "1.13", optional = true }
string_cache = { version = "0.11", optional = true }
thin-vec = { version = "0.2.1", optional = true }
