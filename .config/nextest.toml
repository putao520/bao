# cargo-nextest configuration.
#
# Test resource isolation (task: bun_http h2 tail flake):
#
# `connection_deadline_both_directions_under_oversubscription` deliberately
# spins `CpuHogs::spawn(2)` — 2 × nproc busy-loop threads — to verify deadline
# semantics under designed oversubscription. When nextest schedules the rest
# of the bun_http fleet alongside it, the machine reaches ~3× oversubscription
# (runq ~60 on 20 cores with co-tenant load), and sibling h2/hpack tests trip
# their 20s wall-clock collection deadlines with zero deliveries ("no delivery
# before deadline (fetch hung)") — a batch-tail flake that is green in
# isolation. Socket/conntrack exhaustion was measured and ruled out (TIME_WAIT
# peak 277/262144, conntrack ~1k/262144 during the failure window).
#
# Quarantine the interference source, not the victims: reserving the entire
# test-thread budget for the hog test makes it mutually exclusive with all
# other tests (per nextest docs, "num-test-threads" is the documented way to
# do this), so its spinners never co-run with the fleet. No test code or
# assertions are weakened.
[[profile.default.overrides]]
filter = 'package(bun_http) and test(connection_deadline_both_directions_under_oversubscription)'
threads-required = "num-test-threads"

# Test resource isolation (task: bao-browser h2 wire e2e deadline margin,
# diagnosed 2026-08-31 during the 2026-08-27..31 absorb-wave closure):
#
# The `h2_fetch_node_stack_e2e_tests::window_fetch_*` round trips drive a real
# fetch (AsyncHTTP on HTTPThread) against the in-process H2 fixture server
# under a hard 20s wall-clock delivery deadline. They finish in ~0.2s in
# isolation, but the fleet grew ~40% (7444 → 10478 tests) with the absorb
# wave, and at default 20-way concurrency exactly one of the four starves past
# the deadline per run with zero deliveries — three fleet-ish runs, three
# different tests, same signature as the hog case above. Discriminating
# evidence: bao-browser suite alone at default -j reproduces (1 fail), the
# same suite at -j 4 is 1747/1747 green, and isolated/module/pair co-runs are
# green with ~90× deadline headroom — scheduling starvation, not a logic
# regression.
#
# Reserve the full test-thread budget so these deadline-bound round trips
# never co-run with the fleet (same documented mechanism as the hog above).
# No test code or assertions are weakened.
[[profile.default.overrides]]
filter = 'package(bao-browser) and test(h2_fetch_node_stack_e2e_tests)'
threads-required = "num-test-threads"

# Test resource isolation (task: page_net destination_matrix fleet starvation,
# diagnosed 2026-09-10 during the v61 final certification batch):
#
# `page_net_bun_full_matrix_e2e_tests::page_net_bun_full_destination_matrix`
# is a full-engine e2e: it boots a whole BaoRuntime (servo ScriptThread +
# constellation) plus real H1/H2 fixture servers and round-trips the entire
# page→bun-bridge destination matrix. In isolation it passes in ~16.7s with 4×
# deadline headroom, but in the full bao-browser fleet at default concurrency
# it starves past its delivery deadline exactly like the two entries above:
# v61 observed FAIL 62.952s with "h2 document never arrived (streams: [],
# alpn-h2 conns: 1, non-h2: 0)" — ALPN h2 handshake completes but zero streams
# get scheduled — 1 red in 3 runs, fleet-only, never isolated (scheduling
# starvation, not a logic regression).
#
# Reserve the full test-thread budget so this deadline-bound matrix never
# co-runs with the fleet (same documented mechanism as the two entries above;
# module-level filter per the precedent — the module currently holds exactly
# this one full-engine test). No test code or assertions are weakened.
[[profile.default.overrides]]
filter = 'package(bao-browser) and test(page_net_bun_full_matrix_e2e_tests)'
threads-required = "num-test-threads"
